<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>An account that holds code adopts only from that code</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="720" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// rule 2: only your own code can replace your code</text><text x="30" y="100.0" font-size="22" fill="#aab0aa">what the account holds</text><text x="640" y="100.0" font-size="22" fill="#aab0aa">what code runs the instruction</text><rect x="30" y="122" width="1140" height="68" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="54" y="165.0" font-size="22" fill="#e2e6e2" font-weight="700">a 7702 delegation (an EOA)</text><text x="640" y="165.0" font-size="22" fill="#e2e6e2">its delegate</text><circle cx="1132" cy="156" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M1124,157 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="206" width="1140" height="68" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="54" y="249.0" font-size="22" fill="#e2e6e2" font-weight="700">a 7702 delegation (an EOA)</text><text x="640" y="249.0" font-size="22" fill="#e2e6e2">code its delegate DELEGATECALLs</text><circle cx="1132" cy="240" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M1124,241 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="290" width="1140" height="68" rx="10" fill="#0a120a" stroke="#6fb2e8" stroke-width="2.5"/><text x="54" y="333.0" font-size="22" fill="#e2e6e2" font-weight="700">nothing yet: being created</text><text x="640" y="333.0" font-size="22" fill="#e2e6e2">its initcode, or a helper of it</text><circle cx="1132" cy="324" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M1124,325 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="374" width="1140" height="68" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="54" y="417.0" font-size="22" fill="#e2e6e2" font-weight="700">its own code</text><text x="640" y="417.0" font-size="22" fill="#e2e6e2">that same code</text><circle cx="1132" cy="408" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M1124,409 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="458" width="1140" height="68" rx="10" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><text x="54" y="501.0" font-size="22" fill="#e2e6e2" font-weight="700">its own code</text><text x="640" y="501.0" font-size="22" fill="#e2e6e2">code it DELEGATECALLs</text><circle cx="1132" cy="492" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M1125.5,485.5 l13,13 M1138.5,485.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="30" y="580.0" font-size="22" fill="#e2e6e2">The last row halts before it costs or touches anything: exactly what byte 0xA7</text><text x="30" y="609.0" font-size="22" fill="#e2e6e2">does in that frame today. Libraries, modules and implementations cannot</text><text x="30" y="638.1" font-size="22" fill="#e2e6e2">replace the code of the account that runs them.</text><text x="30" y="690.0" font-size="22" fill="#aab0aa">"own code" is compared by hash: the same bytes, wherever they were loaded from</text></svg>
