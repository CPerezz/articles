<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>A payload run by DELEGATECALL replaces a Safe&#x27;s code</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="800" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// finding 2: code you borrow replaces your code</text><rect x="30" y="140" width="200" height="150" rx="10" fill="#0a120a" stroke="#aab0aa" stroke-width="2.5"/><text x="50" y="182.0" font-size="22" fill="#e2e6e2" font-weight="700">a module</text><text x="50" y="216.0" font-size="19" fill="#aab0aa">enabled on</text><text x="50" y="240.7" font-size="19" fill="#aab0aa">the Safe</text><rect x="290" y="140" width="260" height="150" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="310" y="182.0" font-size="22" fill="#e2e6e2" font-weight="700">the Safe</text><rect x="310" y="207.0" width="212.0" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="416.0" y="233.2" font-size="20" fill="#33ff33" text-anchor="middle">own code: proxy</text><text x="310" y="272.0" font-size="19" fill="#aab0aa">171 bytes</text><rect x="620" y="140" width="240" height="150" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="640" y="182.0" font-size="22" fill="#e2e6e2" font-weight="700">Safe singleton</text><text x="640" y="216.0" font-size="19" fill="#b491f0">1.4.1, borrowed</text><rect x="930" y="140" width="240" height="150" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="950" y="182.0" font-size="22" fill="#e2e6e2" font-weight="700">a payload</text><text x="950" y="216.0" font-size="19" fill="#b491f0">borrowed</text><rect x="950" y="239.0" width="190.92" height="38" rx="19.0" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="1045.46" y="264.8" font-size="19" fill="#ff9a9f" text-anchor="middle">SETCODEFROM(T)</text><path d="M234,215 L284,215" fill="none" stroke="#aab0aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah5)"/><text x="259" y="202.0" font-size="18" fill="#aab0aa" text-anchor="middle">call</text><path d="M554,215 L614,215" fill="none" stroke="#b491f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><path d="M864,215 L924,215" fill="none" stroke="#b491f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><path d="M1050,136 C1050,80 420,80 420,132" fill="none" stroke="#ff9a9f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah4)"/><text x="735" y="84.0" font-size="20" fill="#ff9a9f" text-anchor="middle" font-weight="700">draft: the payload replaces the Safe's code</text><line x1="290" y1="312" x2="1170" y2="312" stroke="#b491f0" stroke-width="2"/><line x1="290" y1="302" x2="290" y2="312" stroke="#b491f0" stroke-width="2"/><line x1="1170" y1="302" x2="1170" y2="312" stroke="#b491f0" stroke-width="2"/><text x="730" y="342.0" font-size="20" fill="#b491f0" text-anchor="middle">purple arrows: DELEGATECALL, so all three run as the Safe</text><rect x="30" y="380" width="555" height="330" rx="10" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><text x="54" y="424.0" font-size="24" fill="#ff9a9f" font-weight="700">draft: the Safe afterwards</text><circle cx="72" cy="476" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M65.5,469.5 l13,13 M78.5,469.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="104" y="484.0" font-size="21" fill="#e2e6e2">its code is T, the payload's pick</text><circle cx="72" cy="528" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M64,529 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="536.0" font-size="21" fill="#e2e6e2">owners, threshold, modules: same</text><circle cx="72" cy="580" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M64,581 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="588.0" font-size="21" fill="#e2e6e2">singleton slot and balance: same</text><text x="54" y="650.0" font-size="20" fill="#aab0aa">the module call reports success, and a</text><text x="54" y="676.0" font-size="20" fill="#aab0aa">guard checking storage sees nothing</text><rect x="615" y="380" width="555" height="330" rx="10" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><text x="639" y="424.0" font-size="24" fill="#33ff33" font-weight="700">with rule 2</text><text x="639" y="476.0" font-size="21" fill="#e2e6e2">SETCODEFROM asks first: is the code</text><text x="639" y="503.7" font-size="21" fill="#e2e6e2">running here the Safe's own code?</text><text x="639" y="531.4" font-size="21" fill="#e2e6e2">The payload is not, so the frame halts</text><text x="639" y="559.2" font-size="21" fill="#e2e6e2">before any gas, as 0xA7 does today.</text><circle cx="657" cy="624" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M649,625 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="689" y="632.0" font-size="21" fill="#e2e6e2">the Safe keeps its proxy</text><text x="639" y="676.0" font-size="20" fill="#aab0aa">the module call reports failure</text><text x="30" y="760.0" font-size="22" fill="#aab0aa">Safe 1.4.1 proxy and singleton, mainnet bytecode, run on two implementations</text></svg>
