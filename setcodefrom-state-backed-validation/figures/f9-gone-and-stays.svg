<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Use cases the update removes and use cases it keeps</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="800" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// what you can no longer do, and what stays</text><rect x="30" y="80" width="555" height="680" rx="10" fill="#0a120a" stroke="#ff9a9f" stroke-width="2.5"/><text x="54" y="124.0" font-size="26" fill="#ff9a9f" font-weight="700" letter-spacing="2">GONE</text><circle cx="72" cy="176" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M65.5,169.5 l13,13 M78.5,169.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="104" y="184.0" font-size="24" fill="#e2e6e2" font-weight="700">proxies graduating</text><text x="104" y="218.0" font-size="21" fill="#aab0aa">a proxy, clone or Safe taking</text><text x="104" y="245.3" font-size="21" fill="#aab0aa">its implementation's code</text><circle cx="72" cy="318" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M65.5,311.5 l13,13 M78.5,311.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="104" y="326.0" font-size="24" fill="#e2e6e2" font-weight="700">borrowed code adopting</text><text x="104" y="360.0" font-size="21" fill="#aab0aa">a library, module, facet or</text><text x="104" y="387.3" font-size="21" fill="#aab0aa">payload, for an account with code</text><circle cx="72" cy="460" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M65.5,453.5 l13,13 M78.5,453.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="104" y="468.0" font-size="24" fill="#e2e6e2" font-weight="700">reading your new code</text><text x="104" y="502.0" font-size="21" fill="#aab0aa">EXTCODEHASH(self) right after</text><text x="104" y="529.3" font-size="21" fill="#aab0aa">adopting still shows the old one</text><circle cx="72" cy="602" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M65.5,595.5 l13,13 M78.5,595.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="104" y="610.0" font-size="24" fill="#e2e6e2" font-weight="700">adopt, then call yourself</text><text x="104" y="644.0" font-size="21" fill="#aab0aa">the call runs the old code until</text><text x="104" y="671.3" font-size="21" fill="#aab0aa">your outermost frame is over</text><rect x="615" y="80" width="555" height="680" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="639" y="124.0" font-size="26" fill="#33ff33" font-weight="700" letter-spacing="2">STAYS</text><circle cx="657" cy="176" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M649,177 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="689" y="184.0" font-size="24" fill="#e2e6e2" font-weight="700">a cheap copy of deployed code</text><text x="689" y="218.0" font-size="21" fill="#aab0aa">initcode writes state and adopts,</text><text x="689" y="245.3" font-size="21" fill="#aab0aa">flat 9300 or 12200 gas</text><circle cx="657" cy="290" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M649,291 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="689" y="298.0" font-size="24" fill="#e2e6e2" font-weight="700">retiring the key</text><text x="689" y="332.0" font-size="21" fill="#aab0aa">an EOA adopts through its</text><text x="689" y="359.3" font-size="21" fill="#aab0aa">delegate, modules included</text><circle cx="657" cy="404" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M649,405 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="689" y="412.0" font-size="24" fill="#e2e6e2" font-weight="700">a code account on your key</text><text x="689" y="446.0" font-size="21" fill="#aab0aa">through 8141 frame transactions</text><circle cx="657" cy="518" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M649,519 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="689" y="526.0" font-size="24" fill="#e2e6e2" font-weight="700">upgrading in place</text><text x="689" y="560.0" font-size="21" fill="#aab0aa">the template adopts again,</text><text x="689" y="587.3" font-size="21" fill="#aab0aa">from its own code</text><circle cx="657" cy="632" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M649,633 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="689" y="640.0" font-size="24" fill="#e2e6e2" font-weight="700">result flag and gas table</text><text x="689" y="674.0" font-size="21" fill="#aab0aa">unchanged</text></svg>
