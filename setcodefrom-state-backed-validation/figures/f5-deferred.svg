<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>The adopted code is written when the account&#x27;s outermost frame ends</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="740" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// rule 1: record now, switch when your outermost frame ends</text><text x="30" y="104.0" font-size="22" fill="#aab0aa">frames of account A</text><rect x="60" y="190" width="840" height="64" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="78" y="231.0" font-size="22" fill="#e2e6e2">A's outermost frame: old code</text><rect x="470" y="120" width="300" height="56" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="488" y="156.0" font-size="22" fill="#e2e6e2">an inner frame of A</text><path d="M440,190 C440,150 450,148 466,148" fill="none" stroke="#b491f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><path d="M774,148 C790,148 800,150 800,186" fill="none" stroke="#b491f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><line x1="620" y1="176" x2="620" y2="300" stroke="#e8a83a" stroke-width="2.5" stroke-dasharray="5 6"/><rect x="373.32" y="303.0" width="353.36" height="38" rx="19.0" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="550.0" y="329.9" font-size="22" fill="#e8a83a" text-anchor="middle">SETCODEFROM(T): recorded</text><line x1="900" y1="110" x2="900" y2="480" stroke="#33ff33" stroke-width="3"/><rect x="787.42" y="303.0" width="285.16" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="930.0" y="329.9" font-size="22" fill="#33ff33" text-anchor="middle">frame ends: written</text><text x="30" y="404.0" font-size="22" fill="#aab0aa">what every observer sees as A's code</text><rect x="60" y="420" width="840" height="56" rx="10" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="480.0" y="456.0" font-size="22" fill="#e2e6e2" text-anchor="middle">the old code: EXTCODEHASH, EXTCODECOPY, calls into A</text><rect x="900" y="420" width="240" height="56" rx="10" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="1020.0" y="456.0" font-size="24" fill="#33ff33" text-anchor="middle" font-weight="700">T</text><path d="M60,520 L1140,520" fill="none" stroke="#aab0aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah5)"/><text x="1140" y="548.0" font-size="20" fill="#aab0aa" text-anchor="end">time</text><text x="30" y="596.0" font-size="22" fill="#e2e6e2">▸ inner frames are A's too: a DELEGATECALL, or someone calling A back</text><text x="30" y="632.0" font-size="22" fill="#e2e6e2">▸ a revert or a halt drops the recording, like any other state change</text><text x="30" y="668.0" font-size="22" fill="#aab0aa">▸ several recordings: the last one that was not reverted is written</text><text x="30" y="704.0" font-size="22" fill="#aab0aa">▸ a creation is the same rule: the code appears when the creation completes</text></svg>
