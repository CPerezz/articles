<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>No deployed code executes 0xA7 and keeps going</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="700" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// the census: does any deployed code already run byte 0xA7?</text><rect x="30" y="92" width="400.0" height="44" rx="4" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="446.0" y="122.0" font-size="24" fill="#e2e6e2" font-weight="700">104,313,762</text><text x="620" y="122.0" font-size="22" fill="#aab0aa">contract creations that left code</text><rect x="30" y="166" width="323.3" height="44" rx="4" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="369.34095993867504" y="196.0" font-size="24" fill="#e2e6e2" font-weight="700">3,031,417</text><text x="620" y="196.0" font-size="22" fill="#aab0aa">distinct codes</text><rect x="30" y="240" width="265.7" height="44" rx="4" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="311.7251751284868" y="270.0" font-size="24" fill="#e8a83a" font-weight="700">212,172</text><text x="620" y="270.0" font-size="22" fill="#e2e6e2">have 0xA7 where an instruction can start</text><rect x="30" y="314" width="73.0" height="44" rx="4" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="118.95264129946266" y="344.0" font-size="24" fill="#e8a83a" font-weight="700">29</text><text x="620" y="344.0" font-size="22" fill="#e2e6e2">a static analysis cannot rule out</text><rect x="30" y="388" width="52.0" height="44" rx="4" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="97.95052723087872" y="418.0" font-size="24" fill="#e8a83a" font-weight="700">11</text><text x="620" y="418.0" font-size="22" fill="#e2e6e2">reach it from their first instruction</text><rect x="30" y="462" width="15.0" height="44" rx="4" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="61.01707013111666" y="492.0" font-size="24" fill="#ff9a9f" font-weight="700">2</text><text x="620" y="492.0" font-size="22" fill="#e2e6e2">execute it</text><text x="46" y="566.0" font-size="24" fill="#33ff33" font-weight="700">0</text><text x="620" y="566.0" font-size="22" fill="#e2e6e2">execute it and keep going</text><text x="30" y="636.0" font-size="22" fill="#aab0aa">84,825 of the 212,172 have the byte only in their metadata hash.</text><text x="30" y="664.6" font-size="22" fill="#aab0aa">The two that execute it halt on the very next instruction, on every input.</text><text x="1170" y="80.0" font-size="18" fill="#aab0aa" text-anchor="end">bars: log scale</text></svg>
