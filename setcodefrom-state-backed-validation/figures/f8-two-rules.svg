<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Each of the two rules closes one of the two findings</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="600" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// one rule per finding: neither is enough alone</text><text x="520" y="110.0" font-size="22" fill="#aab0aa" text-anchor="middle">draft</text><text x="690" y="110.0" font-size="22" fill="#aab0aa" text-anchor="middle">rule 1 only</text><text x="860" y="110.0" font-size="22" fill="#aab0aa" text-anchor="middle">rule 2 only</text><text x="1050" y="110.0" font-size="22" fill="#33ff33" text-anchor="middle" font-weight="700">both</text><rect x="30" y="140" width="1140" height="120" rx="10" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="54" y="192.0" font-size="22" fill="#e2e6e2" font-weight="700">the router gives away the NFT</text><text x="54" y="228.0" font-size="22" fill="#aab0aa">show one code, run another</text><circle cx="520" cy="200" r="22" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M513.5,193.5 l13,13 M526.5,193.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><circle cx="690" cy="200" r="22" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M682,201 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="860" cy="200" r="22" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M853.5,193.5 l13,13 M866.5,193.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><circle cx="1050" cy="200" r="22" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M1042,201 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="290" width="1140" height="120" rx="10" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="54" y="342.0" font-size="22" fill="#e2e6e2" font-weight="700">the Safe loses its code</text><text x="54" y="378.0" font-size="22" fill="#aab0aa">borrowed code replaces yours</text><circle cx="520" cy="350" r="22" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M513.5,343.5 l13,13 M526.5,343.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><circle cx="690" cy="350" r="22" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M683.5,343.5 l13,13 M696.5,343.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><circle cx="860" cy="350" r="22" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M852,351 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1050" cy="350" r="22" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M1042,351 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="476.0" font-size="22" fill="#e2e6e2">rule 1: the adopted code takes effect when the outermost frame ends</text><text x="30" y="505.0" font-size="22" fill="#e2e6e2">rule 2: only an account's own code can replace its code</text><text x="30" y="566.0" font-size="22" fill="#aab0aa">every cell was run on mainnet bytecode; "draft" and "both" on two implementations</text></svg>
