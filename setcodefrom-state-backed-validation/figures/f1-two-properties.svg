<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Two properties of deployed code that the draft gave up</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="640" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// two things every contract can count on today</text><rect x="30" y="80" width="555" height="400" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="54" y="124.0" font-size="24" fill="#33ff33" font-weight="700">1. what you show is what you run</text><rect x="54" y="156" width="230" height="110" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="72" y="196.0" font-size="24" fill="#e2e6e2" font-weight="700">account A</text><rect x="72" y="215.0" width="107.84" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="125.92" y="241.9" font-size="22" fill="#33ff33" text-anchor="middle">code X</text><text x="54" y="304.0" font-size="22" fill="#e2e6e2">A's frames run X</text><path d="M540,196 L296,196" fill="none" stroke="#6fb2e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah3)"/><text x="560" y="176.0" font-size="22" fill="#6fb2e8" text-anchor="end">EXTCODEHASH(A)?</text><path d="M296,236 L540,236" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><text x="560" y="262.0" font-size="22" fill="#33ff33" text-anchor="end" font-weight="700">X</text><text x="54" y="350.0" font-size="22" fill="#aab0aa">so a contract can recognise a caller</text><text x="54" y="378.6" font-size="22" fill="#aab0aa">by its code, and trust it</text><circle cx="72" cy="440" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M65.5,433.5 l13,13 M78.5,433.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="102" y="448.0" font-size="22" fill="#ff9a9f">draft: A shows X while it runs Y</text><rect x="615" y="80" width="555" height="400" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="639" y="124.0" font-size="24" fill="#33ff33" font-weight="700">2. your code is yours</text><rect x="639" y="156" width="172" height="110" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="657" y="196.0" font-size="24" fill="#e2e6e2" font-weight="700">account A</text><rect x="657" y="215.0" width="107.84" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="710.92" y="241.9" font-size="22" fill="#33ff33" text-anchor="middle">code X</text><path d="M818,211 L966,211" fill="none" stroke="#b491f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><text x="892" y="196.0" font-size="18" fill="#b491f0" text-anchor="middle">DELEGATECALL</text><rect x="974" y="156" width="172" height="110" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="992" y="196.0" font-size="24" fill="#e2e6e2" font-weight="700">library L</text><rect x="992" y="215.0" width="107.84" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="1045.92" y="241.9" font-size="22" fill="#b491f0" text-anchor="middle">code L</text><circle cx="657" cy="316" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M649,317 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="687" y="324.0" font-size="22" fill="#e2e6e2">L can write A's storage</text><circle cx="657" cy="366" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M649,367 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="687" y="374.0" font-size="22" fill="#e2e6e2">L cannot replace A's code</text><circle cx="657" cy="440" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M650.5,433.5 l13,13 M663.5,433.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="687" y="448.0" font-size="22" fill="#ff9a9f">draft: L replaces A's code</text><text x="30" y="536.0" font-size="22" fill="#aab0aa">both hold since Cancun: EIP-6780 took away the last way to change</text><text x="30" y="564.6" font-size="22" fill="#aab0aa">deployed code. Routers, wallets, guards and registries lean on them.</text><text x="30" y="610.0" font-size="22" fill="#e2e6e2" font-weight="700">the draft of SETCODEFROM gave both up. The update gives both back.</text></svg>
