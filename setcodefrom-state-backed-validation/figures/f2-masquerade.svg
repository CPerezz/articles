<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>An account that shows a pair&#x27;s code while it runs its own</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="900" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// finding 1: show one code, run another</text><rect x="83.8" y="80" width="172.4" height="50" rx="10" fill="#0a120a" stroke="#ff9a9f" stroke-width="2.5"/><text x="170" y="113.0" font-size="22" fill="#e2e6e2" text-anchor="middle" font-weight="700">attacker M</text><line x1="170" y1="130" x2="170" y2="690" stroke="#182818" stroke-width="2" stroke-dasharray="4 7"/><rect x="461.08" y="80" width="117.84" height="50" rx="10" fill="#0a120a" stroke="#6fb2e8" stroke-width="2.5"/><text x="520" y="113.0" font-size="22" fill="#e2e6e2" text-anchor="middle" font-weight="700">router</text><line x1="520" y1="130" x2="520" y2="690" stroke="#182818" stroke-width="2" stroke-dasharray="4 7"/><rect x="764.26" y="80" width="131.48000000000002" height="50" rx="10" fill="#0a120a" stroke="#6fb2e8" stroke-width="2.5"/><text x="830" y="113.0" font-size="22" fill="#e2e6e2" text-anchor="middle" font-weight="700">factory</text><line x1="830" y1="130" x2="830" y2="690" stroke="#182818" stroke-width="2" stroke-dasharray="4 7"/><rect x="980.16" y="80" width="199.68" height="50" rx="10" fill="#0a120a" stroke="#e8a83a" stroke-width="2.5"/><text x="1080" y="113.0" font-size="22" fill="#e2e6e2" text-anchor="middle" font-weight="700">victim's NFT</text><line x1="1080" y1="130" x2="1080" y2="690" stroke="#182818" stroke-width="2" stroke-dasharray="4 7"/><rect x="41.06" y="159.0" width="257.88" height="38" rx="19.0" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="170.0" y="185.9" font-size="22" fill="#ff9a9f" text-anchor="middle">SETCODEFROM(pair)</text><rect x="310" y="148" width="360" height="62" fill="#050805"/><text x="320" y="172.0" font-size="22" fill="#e2e6e2">M now shows a pair's code</text><text x="320" y="200.0" font-size="22" fill="#aab0aa">and keeps running its own</text><path d="M170,262 L514,262" fill="none" stroke="#ff9a9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah4)"/><text x="345.0" y="250.0" font-size="22" fill="#ff9a9f" text-anchor="middle">move the NFT to me</text><path d="M520,332 L824,332" fill="none" stroke="#6fb2e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah3)"/><text x="675.0" y="320.0" font-size="22" fill="#6fb2e8" text-anchor="middle">is M a pair?</text><text x="850" y="392.0" font-size="22" fill="#aab0aa">reads 73 bytes</text><text x="850" y="419.5" font-size="22" fill="#aab0aa">of M's code</text><path d="M830,462 L526,462" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#ah0)"/><text x="675.0" y="450.0" font-size="22" fill="#33ff33" text-anchor="middle" font-weight="700">yes</text><path d="M520,532 L1074,532" fill="none" stroke="#6fb2e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah3)"/><text x="800.0" y="520.0" font-size="22" fill="#6fb2e8" text-anchor="middle">transfer: victim → M</text><rect x="41.06" y="593.0" width="257.88" height="38" rx="19.0" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="170.0" y="619.9" font-size="22" fill="#ff9a9f" text-anchor="middle">SETCODEFROM(twin)</text><rect x="310" y="582" width="380" height="62" fill="#050805"/><text x="320" y="606.0" font-size="22" fill="#e2e6e2">back to its old code:</text><text x="320" y="634.0" font-size="22" fill="#aab0aa">no code change left to see</text><rect x="30" y="716" width="555" height="110" rx="10" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><text x="54" y="758.0" font-size="24" fill="#ff9a9f" font-weight="700">draft</text><text x="54" y="792.0" font-size="22" fill="#e2e6e2">the NFT moves to the attacker</text><rect x="615" y="716" width="555" height="110" rx="10" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><text x="639" y="758.0" font-size="24" fill="#33ff33" font-weight="700">with the update</text><text x="639" y="792.0" font-size="22" fill="#e2e6e2">the factory says no: "Not pair"</text><text x="30" y="868.0" font-size="22" fill="#aab0aa">sudoswap v1 router and factory, mainnet bytecode, run on two implementations</text></svg>
