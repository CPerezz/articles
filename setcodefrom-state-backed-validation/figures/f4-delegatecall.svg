<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Most contracts ever created run borrowed code</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="820" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// who runs borrowed code?</text><text x="30" y="122.0" font-size="46" fill="#b491f0" font-weight="700">62.6 %</text><text x="236" y="102.0" font-size="22" fill="#e2e6e2">of the 104,313,762 contract creations that left code</text><text x="236" y="132.0" font-size="20" fill="#aab0aa">can run code they borrow: a DELEGATECALL or CALLCODE is reachable</text><text x="30" y="206.0" font-size="22" fill="#e2e6e2" font-weight="700">minimal clones (ERC-1167)</text><text x="30" y="236.0" font-size="19" fill="#aab0aa">45 bytes that forward every call</text><text x="30" y="259.8" font-size="19" fill="#aab0aa">to one fixed implementation</text><rect x="600" y="186" width="275.7" height="48" rx="4" fill="#b491f0" stroke="#b491f0" stroke-width="2"/><text x="889.6685983580958" y="219.0" font-size="22" fill="#b491f0" font-weight="700">at least 49.2 %</text><text x="30" y="306.0" font-size="22" fill="#e2e6e2" font-weight="700">other code that can DELEGATECALL</text><text x="30" y="336.0" font-size="19" fill="#aab0aa">Safe proxies, other proxies,</text><text x="30" y="359.8" font-size="19" fill="#aab0aa">wallets, a long tail</text><rect x="600" y="286" width="75.0" height="48" rx="4" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="689.0297564764273" y="319.0" font-size="22" fill="#b491f0" font-weight="700">13.4 %</text><text x="30" y="406.0" font-size="22" fill="#e2e6e2" font-weight="700">never borrows code</text><text x="30" y="436.0" font-size="19" fill="#aab0aa">no DELEGATECALL or CALLCODE</text><text x="30" y="459.8" font-size="19" fill="#aab0aa">it can reach</text><rect x="600" y="386" width="209.3" height="48" rx="4" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="823.3016451654769" y="419.0" font-size="22" fill="#e2e6e2" font-weight="700">37.4 %</text><text x="30" y="500.0" font-size="18" fill="#aab0aa">clones checked byte for byte on the 400 most created codes, 94.5 % of these creations</text><line x1="30" y1="528" x2="1170" y2="528" stroke="#182818" stroke-width="2"/><text x="30" y="572.0" font-size="22" fill="#ff9a9f" font-weight="700">under the draft, each one's code is only as fixed as what it borrows</text><rect x="30" y="603.0" width="112.8" height="38" rx="19.0" fill="#0a120a" stroke="#e2e6e2" stroke-width="2"/><text x="86.4" y="629.2" font-size="20" fill="#e2e6e2" text-anchor="middle">a clone</text><path d="M150.8,622 L324,622" fill="none" stroke="#b491f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><rect x="332" y="603.0" width="249.2" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="456.6" y="629.2" font-size="20" fill="#b491f0" text-anchor="middle">its implementation</text><path d="M588,622 L614,622" fill="none" stroke="#b491f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><rect x="622" y="603.0" width="422.8" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="833.4" y="629.2" font-size="20" fill="#b491f0" text-anchor="middle">whatever that can be made to run</text><rect x="30" y="657.0" width="174.8" height="38" rx="19.0" fill="#0a120a" stroke="#e2e6e2" stroke-width="2"/><text x="117.4" y="683.2" font-size="20" fill="#e2e6e2" text-anchor="middle">a Safe proxy</text><path d="M212.8,676 L324,676" fill="none" stroke="#b491f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><rect x="332" y="657.0" width="249.2" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="456.6" y="683.2" font-size="20" fill="#b491f0" text-anchor="middle">the Safe singleton</text><path d="M588,676 L614,676" fill="none" stroke="#b491f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><rect x="622" y="657.0" width="348.4" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="796.2" y="683.2" font-size="20" fill="#b491f0" text-anchor="middle">every payload it is handed</text><rect x="30" y="711.0" width="261.6" height="38" rx="19.0" fill="#0a120a" stroke="#e2e6e2" stroke-width="2"/><text x="160.8" y="737.2" font-size="20" fill="#e2e6e2" text-anchor="middle">an upgradable proxy</text><path d="M299.6,730 L324,730" fill="none" stroke="#b491f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><rect x="332" y="711.0" width="249.2" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="456.6" y="737.2" font-size="20" fill="#b491f0" text-anchor="middle">its implementation</text><path d="M588,730 L614,730" fill="none" stroke="#b491f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><rect x="622" y="711.0" width="410.4" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="827.2" y="737.2" font-size="20" fill="#b491f0" text-anchor="middle">the next one its admin installs</text><text x="30" y="794.0" font-size="22" fill="#33ff33" font-weight="700">with rule 2, only the account's own code can replace it</text></svg>
