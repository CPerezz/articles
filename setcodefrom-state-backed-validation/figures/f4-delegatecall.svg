<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Who runs borrowed code, and who picks it</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="760" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// who runs borrowed code, and who picks it?</text><text x="30" y="122.0" font-size="46" fill="#b491f0" font-weight="700">62.6 %</text><text x="236" y="102.0" font-size="22" fill="#e2e6e2">of the 104,313,762 contract creations that left code</text><text x="236" y="132.0" font-size="20" fill="#aab0aa">can run code they borrow: a DELEGATECALL or CALLCODE is reachable</text><text x="30" y="206.0" font-size="22" fill="#e2e6e2" font-weight="700">never borrows code</text><text x="30" y="236.0" font-size="19" fill="#aab0aa">no DELEGATECALL or CALLCODE</text><text x="30" y="259.8" font-size="19" fill="#aab0aa">it can reach</text><rect x="600" y="186" width="411.3" height="48" rx="4" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="1025.2968002986433" y="219.0" font-size="22" fill="#e2e6e2" font-weight="700">37.4 %</text><text x="30" y="306.0" font-size="22" fill="#e2e6e2" font-weight="700">borrows code that is fixed for good</text><text x="30" y="336.0" font-size="19" fill="#aab0aa">a clone of an implementation</text><text x="30" y="359.8" font-size="19" fill="#aab0aa">that delegates no further</text><rect x="600" y="286" width="301.3" height="48" rx="4" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="915.3498792863106" y="319.0" font-size="22" fill="#33ff33" font-weight="700">27.4 %</text><text x="30" y="406.0" font-size="22" fill="#e2e6e2" font-weight="700">borrows code that someone picks</text><text x="30" y="436.0" font-size="19" fill="#aab0aa">the target comes from the call's</text><text x="30" y="459.8" font-size="19" fill="#aab0aa">input, storage or memory</text><rect x="600" y="386" width="339.9" height="48" rx="4" fill="#b491f0" stroke="#b491f0" stroke-width="2"/><text x="953.9449664229676" y="419.0" font-size="22" fill="#b491f0" font-weight="700">30.9 %</text><line x1="826.4845304814249" y1="386" x2="826.4845304814249" y2="434" stroke="#050805" stroke-width="3"/><text x="713.2422652407124" y="417.0" font-size="16" fill="#050805" text-anchor="middle" font-weight="700">CoinTool's XEN proxies</text><text x="30" y="506.0" font-size="22" fill="#e2e6e2" font-weight="700">not followed</text><text x="30" y="536.0" font-size="19" fill="#aab0aa">outside the 400 most created</text><text x="30" y="559.8" font-size="19" fill="#aab0aa">codes, or undecided</text><rect x="600" y="486" width="47.4" height="48" rx="4" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="661.4083539920784" y="519.0" font-size="22" fill="#e2e6e2" font-weight="700">4.3 %</text><text x="30" y="590.0" font-size="18" fill="#aab0aa">shares of all creations; the 400 most created of these codes (94.5 %) followed to what they borrow</text><line x1="30" y1="616" x2="1170" y2="616" stroke="#182818" stroke-width="2"/><text x="30" y="660.0" font-size="22" fill="#e2e6e2">today: whoever picks the code can spend what the contract holds</text><text x="30" y="696.0" font-size="22" fill="#ff9a9f" font-weight="700">draft: they can also replace the contract's code</text><text x="30" y="732.0" font-size="22" fill="#33ff33" font-weight="700">with rule 2: only the contract's own code can</text></svg>
