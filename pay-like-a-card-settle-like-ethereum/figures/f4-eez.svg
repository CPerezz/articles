<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>EEZ: your rollup&#x27;s leg and the base layer&#x27;s leg land in the same block</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="520" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// EEZ: one block, not a wire transfer</text><text x="30" y="100.0" font-size="22" fill="#ff9a9f" font-weight="700" letter-spacing="1">TODAY</text><g transform="translate(100,160) scale(1)" fill="none" stroke="#aab0aa" stroke-width="3.00" stroke-linecap="round" stroke-linejoin="round"><path d="M-30,-14 L0,-26 L30,-14 L0,-2 Z"/><path d="M-30,0 L0,12 L30,0"/><path d="M-30,14 L0,26 L30,14"/></g><g transform="translate(520,160) scale(1)" fill="none" stroke="#aab0aa" stroke-width="3.00" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-32 L-19,0 L0,10 L19,0 Z"/><path d="M-19,0 L0,-8 L19,0"/><path d="M0,-32 V10"/><path d="M-19,5 L0,16 L19,5 L0,32 Z"/></g><line x1="140" y1="160" x2="480" y2="160" stroke="#aab0aa" stroke-width="2" stroke-dasharray="6 8"/><circle cx="310" cy="160" r="11" fill="#e8a83a" stroke="#050805" stroke-width="2"/><circle cx="310" cy="120" r="14" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M303.5,113.5 l13,13 M316.5,113.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="310" y="194.0" font-size="18" fill="#ff9a9f" text-anchor="middle">trusted bridge</text><text x="100" y="218.0" font-size="19" fill="#aab0aa" text-anchor="middle">your rollup</text><text x="520" y="218.0" font-size="19" fill="#aab0aa" text-anchor="middle">base layer</text><text x="610" y="140.0" font-size="20" fill="#aab0aa">two separate ledgers, a bridge you</text><text x="610" y="168.0" font-size="20" fill="#aab0aa">must trust in between, and your</text><text x="610" y="196.0" font-size="20" fill="#aab0aa">money in limbo while it crosses</text><text x="30" y="270.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="1">WITH EEZ</text><text x="165" y="270.0" font-size="19" fill="#33ff33">no bridge, nothing new to trust</text><rect x="30" y="290" width="820" height="200" rx="14" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><g transform="translate(64,324) scale(0.55)" fill="none" stroke="#33ff33" stroke-width="5.45" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-28 L26,-15 L0,-2 L-26,-15 Z"/><path d="M-26,-15 V15 L0,28 V-2"/><path d="M26,-15 V15 L0,28"/></g><text x="94" y="332.0" font-size="21" fill="#33ff33" font-weight="700" letter-spacing="1">ONE ETHEREUM BLOCK</text><g transform="translate(210,395) scale(1)" fill="none" stroke="#33ff33" stroke-width="3.00" stroke-linecap="round" stroke-linejoin="round"><path d="M-22,-30 H10 L22,-18 V30 H-22 Z"/><path d="M10,-30 V-18 H22"/><path d="M-12,-12 H8"/><path d="M-12,0 H12"/><path d="M-12,12 H4"/></g><text x="210" y="455.0" font-size="20" fill="#e2e6e2" text-anchor="middle" font-weight="700">proof + update</text><text x="210" y="479.0" font-size="18" fill="#aab0aa" text-anchor="middle">postAndVerifyBatch</text><g transform="translate(670,395) scale(1)" fill="none" stroke="#33ff33" stroke-width="3.00" stroke-linecap="round" stroke-linejoin="round"><path d="M-22,-30 H10 L22,-18 V30 H-22 Z"/><path d="M10,-30 V-18 H22"/><path d="M-12,-12 H8"/><path d="M-12,0 H12"/><path d="M-12,12 H4"/></g><text x="670" y="455.0" font-size="20" fill="#e2e6e2" text-anchor="middle" font-weight="700">your checkout</text><text x="670" y="479.0" font-size="18" fill="#aab0aa" text-anchor="middle">the base-layer leg</text><line x1="240" y1="395" x2="395" y2="395" stroke="#e8a83a" stroke-width="2"/><line x1="485" y1="395" x2="640" y2="395" stroke="#e8a83a" stroke-width="2"/><g transform="translate(440,395) scale(1)" fill="none" stroke="#e8a83a" stroke-width="3.00" stroke-linecap="round" stroke-linejoin="round"><path d="M-30,0 a18,11 0 1 0 36,0 a18,11 0 1 0 -36,0"/><path d="M-6,0 a18,11 0 1 0 36,0 a18,11 0 1 0 -36,0"/></g><text x="440" y="355.0" font-size="19" fill="#e8a83a" text-anchor="middle">both land, or neither does</text><path d="M862,395 L990,395" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><text x="926" y="377.0" font-size="19" fill="#aab0aa" text-anchor="middle">mirrors it</text><g transform="translate(1060,395) scale(1)" fill="none" stroke="#33ff33" stroke-width="3.00" stroke-linecap="round" stroke-linejoin="round"><path d="M-30,-14 L0,-26 L30,-14 L0,-2 Z"/><path d="M-30,0 L0,12 L30,0"/><path d="M-30,14 L0,26 L30,14"/></g><text x="1060" y="455.0" font-size="19" fill="#aab0aa" text-anchor="middle">your rollup</text><text x="1060" y="479.0" font-size="18" fill="#aab0aa" text-anchor="middle">on the spot</text></svg>
