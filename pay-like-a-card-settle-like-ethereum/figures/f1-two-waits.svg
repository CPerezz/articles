<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>The two waits in any cross-layer payment, and what fixes each one</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="480" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// the two waits</text><line x1="600" y1="80" x2="600" y2="455" stroke="#182818" stroke-width="2" stroke-dasharray="2 8"/><text x="30" y="100.0" font-size="26" fill="#33ff33" font-weight="700" letter-spacing="1">GETTING THERE</text><text x="30" y="130.0" font-size="20" fill="#aab0aa">your value has to reach the base layer</text><text x="630" y="100.0" font-size="26" fill="#6fb2e8" font-weight="700" letter-spacing="1">BEING BELIEVED</text><text x="630" y="130.0" font-size="20" fill="#aab0aa">the shop waits until it can't be undone</text><g transform="translate(90,290) scale(1)" fill="none" stroke="#33ff33" stroke-width="3.00" stroke-linecap="round" stroke-linejoin="round"><path d="M-30,-14 L0,-26 L30,-14 L0,-2 Z"/><path d="M-30,0 L0,12 L30,0"/><path d="M-30,14 L0,26 L30,14"/></g><g transform="translate(520,290) scale(1)" fill="none" stroke="#33ff33" stroke-width="3.00" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-32 L-19,0 L0,10 L19,0 Z"/><path d="M-19,0 L0,-8 L19,0"/><path d="M0,-32 V10"/><path d="M-19,5 L0,16 L19,5 L0,32 Z"/></g><path d="M190,325 q10,-7 20,0 q10,-7 20,0 q10,-7 20,0 q10,-7 20,0 q10,-7 20,0 q10,-7 20,0 q10,-7 20,0 q10,-7 20,0 q10,-7 20,0 q10,-7 20,0 q10,-7 20,0" fill="none" stroke="#aab0aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M135,270 C225,190 385,190 475,270" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#ah0)"/><circle cx="305" cy="210" r="11" fill="#e8a83a" stroke="#050805" stroke-width="2"/><text x="305" y="162.0" font-size="19" fill="#ff9a9f" text-anchor="middle">a trusted bridge or market maker</text><text x="305" y="186.0" font-size="17" fill="#aab0aa" text-anchor="middle">or the rollup's own exit: up to ~1 week</text><text x="90" y="350.0" font-size="20" fill="#aab0aa" text-anchor="middle">your rollup</text><text x="520" y="350.0" font-size="20" fill="#aab0aa" text-anchor="middle">base layer</text><path d="M545,290 L655,290" fill="none" stroke="#aab0aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah5)"/><rect x="556.0" y="273.0" width="88.0" height="34" rx="17.0" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="600.0" y="297.2" font-size="20" fill="#aab0aa" text-anchor="middle">lands</text><line x1="716" y1="290" x2="749" y2="290" stroke="#6fb2e8" stroke-width="2"/><line x1="801" y1="290" x2="834" y2="290" stroke="#6fb2e8" stroke-width="2"/><line x1="886" y1="290" x2="919" y2="290" s