<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>The two-slot checkout at 12, 6, 4 and 2 second slots</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="610" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// the wait is counted in slots</text><rect x="330" y="130" width="154.0" height="338" rx="8" fill="#2a1f08" stroke="#e8a83a" stroke-width="2" stroke-dasharray="6 6"/><g transform="translate(354,102) scale(0.7)" fill="none" stroke="#e8a83a" stroke-width="4.29" stroke-linecap="round" stroke-linejoin="round"><path d="M-26,-17 H26 V17 H-26 Z"/><path d="M-26,-7 H26"/><path d="M-18,8 H-2"/></g><text x="382" y="109.0" font-size="19" fill="#e8a83a">feels like a card tap</text><rect x="760" y="92" width="26" height="16" rx="3" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="796" y="106.0" font-size="18" fill="#aab0aa">block lands</text><rect x="940" y="92" width="26" height="16" rx="3" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="976" y="106.0" font-size="18" fill="#aab0aa">FCR: safe</text><text x="30" y="172.0" font-size="22" fill="#e2e6e2" font-weight="700">12 s slots</text><text x="30" y="198.0" font-size="18" fill="#aab0aa">today</text><rect x="330" y="160" width="366.6" height="34" rx="4" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><rect x="700.6" y="160" width="366.6" height="34" rx="4" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="1085.2" y="185.0" font-size="22" fill="#e2e6e2" font-weight="700">≈ 25 s</text><text x="30" y="254.0" font-size="22" fill="#e2e6e2" font-weight="700">6 s slots</text><text x="30" y="280.0" font-size="18" fill="#aab0aa">EIP-7782, draft</text><rect x="330" y="242" width="181.8" height="34" rx="4" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><rect x="515.8" y="242" width="181.8" height="34" rx="4" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="715.6" y="267.0" font-size="22" fill="#e2e6e2" font-weight="700">≈ 13 s</text><text x="30" y="336.0" font-size="22" fill="#e2e6e2" font-weight="700">4 s slots</text><text x="30" y="362.0" font-size="18" fill="#aab0aa">roadmap sketch</text><rect x="330" y="324" width="120.2" height="34" rx="4" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><rect x="454.2" y="324" width="120.2" height="34" rx="4" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="592.4" y="349.0" font-size="22" fill="#e2e6e2" font-weight="700">≈ 9 s</text><text x="30" y="418.0" font-size="22" fill="#e2e6e2" font-weight="700">2 s slots</text><text x="30" y="444.0" font-size="18" fill="#aab0aa">speculative last step</text><rect x="330" y="406" width="58.6" height="34" rx="4" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><rect x="392.6" y="406" width="58.6" height="34" rx="4" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="498.0" y="431.0" font-size="22" fill="#33ff33" font-weight="700">≈ 5 s</text><line x1="330" y1="508" x2="1100.0" y2="508" stroke="#aab0aa" stroke-width="1.5"/><line x1="330.0" y1="508" x2="330.0" y2="516" stroke="#aab0aa" stroke-width="1.5"/><text x="330.0" y="536.0" font-size="16" fill="#aab0aa" text-anchor="middle">0 s</text><line x1="484.0" y1="508" x2="484.0" y2="516" stroke="#aab0aa" stroke-width="1.5"/><text x="484.0" y="536.0" font-size="16" fill="#aab0aa" text-anchor="middle">5 s</text><line x1="638.0" y1="508" x2="638.0" y2="516" stroke="#aab0aa" stroke-width="1.5"/><text x="638.0" y="536.0" font-size="16" fill="#aab0aa" text-anchor="middle">10 s</text><line x1="792.0" y1="508" x2="792.0" y2="516" stroke="#aab0aa" stroke-width="1.5"/><text x="792.0" y="536.0" font-size="16" fill="#aab0aa" text-anchor="middle">15 s</text><line x1="946.0" y1="508" x2="946.0" y2="516" stroke="#aab0aa" stroke-width="1.5"/><text x="946.0" y="536.0" font-size="16" fill="#aab0aa" text-anchor="middle">20 s</text><line x1="1100.0" y1="508" x2="1100.0" y2="516" stroke="#aab0aa" stroke-width="1.5"/><text x="1100.0" y="536.0" font-size="16" fill="#aab0aa" text-anchor="middle">25 s</text><text x="30" y="588.0" font-size="20" fill="#aab0aa">both pieces count in slots, so every cut to slot time shortens the whole checkout</text></svg>
