<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>FCR and EEZ side by side: what each fixes, where each lives</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="620" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// alike, different, where they meet</text><text x="30" y="194.0" font-size="22" fill="#aab0aa">fixes</text><text x="30" y="270.0" font-size="22" fill="#aab0aa">lives in</text><text x="30" y="346.0" font-size="22" fill="#aab0aa">applies to</text><text x="30" y="422.0" font-size="22" fill="#aab0aa">status</text><rect x="310" y="100" width="340" height="400" rx="12" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="330" y="140.0" font-size="26" fill="#6fb2e8" font-weight="700" letter-spacing="1">FCR</text><g transform="translate(605,131) scale(0.7)" fill="none" stroke="#6fb2e8" stroke-width="4.29" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-28 L22,-20 V-2 C22,14 11,23 0,28 C-11,23 -22,14 -22,-2 V-20 Z"/><path d="M-9,0 L-2,8 L11,-8"/></g><text x="330" y="194.0" font-size="20" fill="#e2e6e2">how long a landed</text><text x="330" y="220.0" font-size="20" fill="#e2e6e2">block takes to trust</text><text x="330" y="270.0" font-size="20" fill="#e2e6e2">every consensus client</text><text x="330" y="296.0" font-size="20" fill="#e2e6e2">on Ethereum</text><text x="330" y="346.0" font-size="20" fill="#e2e6e2">any block, checkout</text><text x="330" y="372.0" font-size="20" fill="#e2e6e2">or not</text><text x="330" y="422.0" font-size="20" fill="#e2e6e2">merged into spec,</text><text x="330" y="448.0" font-size="20" fill="#e2e6e2">rolling out</text><text x="330" y="474.0" font-size="20" fill="#e2e6e2">client by client</text><rect x="730" y="100" width="340" height="400" rx="12" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="750" y="140.0" font-size="26" fill="#33ff33" font-weight="700" letter-spacing="1">EEZ</text><g transform="translate(1025,131) scale(0.7)" fill="none" stroke="#33ff33" stroke-width="4.29" stroke-linecap="round" stroke-linejoin="round"><path d="M-30,0 a18,11 0 1 0 36,0 a18,11 0 1 0 -36,0"/><path d="M-6,0 a18,11 0 1 0 36,0 a18,11 0 1 0 -36,0"/></g><text x="750" y="194.0" font-size="20" fill="#e2e6e2">the crossing, and the</text><text x="750" y="220.0" font-size="20" fill="#e2e6e2">trusted bridge with it</text><text x="750" y="270.0" font-size="20" fill="#e2e6e2">a specific set of rollup</text><text x="750" y="296.0" font-size="20" fill="#e2e6e2">+ base-layer contracts</text><text x="750" y="346.0" font-size="20" fill="#e2e6e2">only actions inside</text><text x="750" y="372.0" font-size="20" fill="#e2e6e2">the zone</text><text x="750" y="422.0" font-size="20" fill="#e2e6e2">live on mainnet,</text><text x="750" y="448.0" font-size="20" fill="#e2e6e2">unaudited</text><rect x="30" y="520" width="1140" height="70" rx="10" fill="#0a120a" stroke="#aab0aa" stroke-width="2"/><g transform="translate(72,555) scale(0.6)" fill="none" stroke="#33ff33" stroke-width="5.00" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-28 L26,-15 L0,-2 L-26,-15 Z"/><path d="M-26,-15 V15 L0,28 V-2"/><path d="M26,-15 V15 L0,28"/></g><g transform="translate(110,553) scale(0.55)" fill="none" stroke="#6fb2e8" stroke-width="5.45" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-28 L22,-20 V-2 C22,14 11,23 0,28 C-11,23 -22,14 -22,-2 V-20 Z"/><path d="M-9,0 L-2,8 L11,-8"/></g><text x="140" y="550.0" font-size="21" fill="#e2e6e2">where they meet: EEZ's result is still just an ordinary block —</text><text x="140" y="578.0" font-size="21" fill="#e2e6e2">FCR confirms it exactly as fast as any other</text></svg>
