# Erigon / state-actor arm, suite A.
# Mirrors the Nethermind arms (/bench/cfg/nm-*-fin1.yaml) with the canonical erigon instance
# settings from ethpandaops/benchmarkoor-tests (jochemnet/v1/glamsterdam-devnet-7/clients.yaml).
# Suite A: two smoke tests; the state-actor arm has no pre-run, as on Nethermind (the spec pre-deploys the fixture accounts).
global:
  log_level: info
  env:
    ER_DATADIR: /schelk-er-sa/erigon
runner:
  client_logs_to_stdout: true
  docker_network: benchmarkoor
  cleanup_on_start: true
  container_runtime: podman
  live_reporting:
    enabled: false
  benchmark:
    results_dir: /bench/results/er-sa-A-RUNDATE
    generate_results_index: true
    generate_suite_stats: true
    tests:
      metadata:
        labels:
          name: er-sa-A-glamsterdam-devnet-7-stateful
          block: "0"
          test-type: stateful
          context: repricing
          fork: amsterdam
          data-disk-type: schelk
      filter: 'regex:(opcode_BALANCE-value_sent_0-account_mode_AccountMode\.EXISTING_EOA-overhead_baseline_False-cache_strategy_CacheStrategy\.NO_CACHE-benchmark-gas-value_160M|transfer_amount_0-case_id_diff_to_existent-benchmark-gas-value_240M)'
      source:
        eest_fixtures:
          local_fixtures_dir: /bench/fixtures/sa-v2-full/erigon
          fixtures_subdir: blockchain_tests_stateful_engine
  client:
    config:
      rollback_strategy: container-recreate
      drop_memory_caches: "steps"
    datadirs:
      erigon:
        source_dir: ${ER_DATADIR}
        method: schelk
  instances:
    - id: er-sa-A
      client: erigon
      image: docker.io/ethpandaops/erigon:glamsterdam-devnet-7
      genesis: ${ER_DATADIR}/chainspec.json
      extra_args:
        - --exec.no-merge=true
        - --exec.no-prune=true
        - --exec.no-background-maintenance
        - --experimental.parallel-commitment
        - --override.amsterdam=1
      bootstrap_fcu:
        enabled: true
        max_retries: 120
        backoff: 30s
      retry_new_payloads_syncing_state:
        enabled: true
        max_retries: 240
        backoff: 30s
