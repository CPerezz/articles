# Besu / jochemnet arm. Serves BOTH the untreated and treated runs: the treatment is applied
# by the pre-run hook, so the runs differ only by results_dir and whether
# BENCHMARKOOR_POST_PRERUN_CMD is exported (see besu-jochemnet-treated.yaml).
#
# GENESIS: geth needed none here (it reads chain config from the datadir); Besu declares
# GenesisFlag "--genesis-file=" and neither payload bundle ships one. jochemnet is a mainnet
# shadowfork -- the fixtures declare chainid 0x01 -- so the genesis IS mainnet is, and the
# canonical Besu mainnet genesis is used. benchmarkoor patches it via genesis_fork_override
# (cfg[fork+"Time"]), turning `amsterdam: 1769856769` into `amsterdamTime`, which is the exact
# equivalent of the geth arm passing --override.amsterdam=1769856769.
global:
  log_level: info
  env:
    BESU_SNAPSHOT_DIR: /schelk/snapshots/besu/jochemnet/24402727
runner:
  client_logs_to_stdout: true
  docker_network: benchmarkoor
  cleanup_on_start: true
  container_runtime: podman
  live_reporting:
    enabled: false
  benchmark:
    results_dir: /data/bench-results/besu-jochemnet-treated
    generate_results_index: true
    generate_suite_stats: true
    tests:
      metadata:
        labels:
          name: besu-jochemnet-glamsterdam-devnet-7-stateful
          block: "24402727"
          test-type: stateful
          context: repricing
          fork: amsterdam
          data-disk-type: schelk
      source:
        eest_fixtures:
          fixtures_url: https://github.com/ethpandaops/benchmarkoor-tests/releases/download/eest-payloads-jochemnet-v1-amsterdam-stateful-d9ad55b3-20260807-000744/eest-payloads-jochemnet-v1-amsterdam-stateful-geth.tar.gz
          fixtures_subdir: benchmarkoor-build-artifacts/eest-payloads/geth/blockchain_tests_stateful_engine
          pre_runs:
            fixtures_subdir: benchmarkoor-build-artifacts/pre-runs/geth/pre_run_bundle
  client:
    config:
      rollback_strategy: container-recreate
      drop_memory_caches: "steps"
    datadirs:
      besu:
        source_dir: ${BESU_SNAPSHOT_DIR}
        method: schelk
        schelk_options:
          promote_post_pre_runs: true
  instances:
    - id: besu-jochemnet
      client: besu
      image: docker.io/ethpandaops/besu:glamsterdam-devnet-7
      genesis: /root/bench/besu-mainnet-genesis.json
      genesis_fork_override: { amsterdam: 1769856769 }
      environment:
        BESU_OPTS: "-Xms8g -Xmx8g -XX:+AlwaysPreTouch"
