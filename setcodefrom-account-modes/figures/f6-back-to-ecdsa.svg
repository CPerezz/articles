<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Two ways back to ECDSA control, and what stays shut</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="950" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// want 4: back to ECDSA</text><text x="30" y="110.0" font-size="24" fill="#b491f0" font-weight="700">A. FROM A DELEGATE, KEY ON</text><rect x="30" y="140" width="300" height="140" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="52" y="188.0" font-size="26" fill="#e2e6e2" font-weight="700">DELEGATED</text><text x="52" y="222.0" font-size="22" fill="#e8a83a">key on</text><g fill="none" stroke="#e8a83a" stroke-width="5.0" stroke-linecap="round"><circle cx="215.0" cy="216" r="10.0"/><path d="M225.0,216 H250.0 M238.0,216 v10.0 M246.0,216 v7.5"/></g><path d="M342,210 L830,210" fill="none" stroke="#b491f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><rect x="389.9" y="165" width="392.3" height="62" fill="#050805" opacity="0.92"/><text x="586" y="192.0" font-size="24" fill="#b491f0" text-anchor="middle" font-weight="700">7702 auth to 0x0</text><text x="586" y="220.0" font-size="22" fill="#aab0aa" text-anchor="middle">not a pointer: code cleared</text><rect x="842" y="140" width="328" height="140" rx="10" fill="#0a120a" stroke="#e8a83a" stroke-width="2.5"/><text x="864" y="188.0" font-size="26" fill="#e2e6e2" font-weight="700">EOA</text><text x="864" y="222.0" font-size="22" fill="#aab0aa">a true EOA again</text><g fill="none" stroke="#e8a83a" stroke-width="5.0" stroke-linecap="round"><circle cx="1095.0" cy="216" r="10.0"/><path d="M1105.0,216 H1130.0 M1118.0,216 v10.0 M1126.0,216 v7.5"/></g><line x1="20" y1="330" x2="1180" y2="330" stroke="#182818" stroke-width="2"/><text x="30" y="384.0" font-size="24" fill="#33ff33" font-weight="700">B. FROM CODE</text><rect x="30" y="414" width="300" height="170" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="52" y="462.0" font-size="26" fill="#33ff33" font-weight="700">CODE</text><text x="52" y="496.0" font-size="22" fill="#aab0aa">PQ, passkey,</text><text x="52" y="524.0" font-size="22" fill="#aab0aa">anything</text><g fill="none" stroke="#e8a83a" stroke-width="4.4" stroke-linecap="round"><circle cx="65.2" cy="556" r="8.8"/><path d="M74.0,556 H96.0 M85.4,556 v8.8 M92.5,556 v6.6"/></g><path d="M49.0,571.8 L99.0,540.2" stroke="#ff9a9f" stroke-width="4.4" stroke-linecap="round"/><path d="M342,499 L580,499" fill="none" stroke="#33ff33" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><text x="461" y="474.0" font-size="22" fill="#33ff33" text-anchor="middle" font-weight="700">SETCODEFROM</text><text x="461" y="540.0" font-size="22" fill="#aab0aa" text-anchor="middle">ECDSA owner</text><text x="461" y="568.2" font-size="22" fill="#aab0aa" text-anchor="middle">template</text><rect x="592" y="414" width="578" height="170" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="614" y="462.0" font-size="26" fill="#33ff33" font-weight="700">CODE, ECDSA owner</text><g fill="none" stroke="#e8a83a" stroke-width="4.4" stroke-linecap="round"><circle cx="627.2" cy="516" r="8.8"/><path d="M636.0,516 H658.0 M647.4,516 v8.8 M654.5,516 v6.6"/></g><rect x="686" y="494" width="220" height="44" rx="8" fill="#0a120a" stroke="#e2e6e2" stroke-width="2"/><text x="796" y="523.0" font-size="22" fill="#e2e6e2" text-anchor="middle">Solidity ECDSA</text><text x="796" y="566.0" font-size="20" fill="#ff9a9f" text-anchor="middle">more gas, slower</text><path d="M906,516 L920,516" fill="none" stroke="#6fb2e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah3)"/><rect x="924" y="494" width="150" height="44" rx="8" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="999" y="523.0" font-size="22" fill="#6fb2e8" text-anchor="middle">your rules</text><text x="614" y="624.0" font-size="22" fill="#aab0aa">no ecrecover for your own address (8151)</text><text x="30" y="672.0" font-size="22" fill="#ff9a9f" font-weight="700">stays shut, on purpose</text><circle cx="48" cy="716" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M41.5,709.5 l13,13 M54.5,709.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="80" y="724.0" font-size="22" fill="#e2e6e2">plain legacy tx</text><text x="1170" y="724.0" font-size="22" fill="#ff9a9f" text-anchor="end">3607</text><circle cx="48" cy="770" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M41.5,763.5 l13,13 M54.5,763.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="80" y="778.0" font-size="22" fill="#e2e6e2">old contracts trusting the key via ecrecover</text><text x="1170" y="778.0" font-size="22" fill="#ff9a9f" text-anchor="end">8151 (draft)</text><rect x="30" y="827.0" width="872.3" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="466.15" y="853.6" font-size="21" fill="#b491f0" text-anchor="middle">ECDSA is all you want? a 7702 delegation already does it natively</text><rect x="30" y="879.0" width="650.96" height="38" rx="19.0" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2" stroke-dasharray="7 6"/><text x="355.48" y="905.6" font-size="21" fill="#6fb2e8" text-anchor="middle">still open: native checks through 8141 frame txs</text></svg>
