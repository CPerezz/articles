<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1155" viewBox="0 0 1200 1155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>The three account shapes that matter and every move between them</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="1155" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// the map</text><line x1="770" y1="110" x2="770" y2="890" stroke="#ff9a9f" stroke-width="2.5" stroke-dasharray="10 8"/><rect x="709.26" y="61.0" width="121.48" height="38" rx="19.0" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="770.0" y="87.9" font-size="22" fill="#ff9a9f" text-anchor="middle">one way</text><text x="30" y="150.0" font-size="24" fill="#e8a83a" font-weight="700" letter-spacing="2">KEY SIDE</text><text x="30" y="180.0" font-size="22" fill="#aab0aa">your key can always take the wheel back</text><text x="810" y="150.0" font-size="24" fill="#33ff33" font-weight="700" letter-spacing="2">CODE SIDE</text><text x="810" y="180.0" font-size="22" fill="#aab0aa">only code decides</text><rect x="30" y="330" width="270" height="340" rx="10" fill="#0a120a" stroke="#e8a83a" stroke-width="2.5"/><text x="48" y="376.0" font-size="28" fill="#e2e6e2" font-weight="700">EOA</text><text x="48" y="410.0" font-size="24" fill="#aab0aa">plain account</text><rect x="48" y="433.0" width="94.2" height="38" rx="19.0" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="95.1" y="459.9" font-size="22" fill="#aab0aa" text-anchor="middle">empty</text><g fill="none" stroke="#e8a83a" stroke-width="4.0" stroke-linecap="round"><circle cx="62.0" cy="508" r="8.0"/><path d="M70.0,508 H90.0 M80.4,508 v8.0 M86.8,508 v6.0"/></g><text x="104" y="516.0" font-size="22" fill="#e8a83a">in charge</text><text x="48" y="562.0" font-size="22" fill="#aab0aa">moved by</text><text x="48" y="590.0" font-size="22" fill="#e2e6e2">your key</text><rect x="350" y="330" width="290" height="340" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="368" y="376.0" font-size="28" fill="#e2e6e2" font-weight="700">DELEGATED</text><text x="368" y="410.0" font-size="24" fill="#e8a83a">key on</text><rect x="368" y="433.0" width="230.6" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="483.3" y="459.9" font-size="22" fill="#b491f0" text-anchor="middle">0xef0100+wallet</text><g fill="none" stroke="#e8a83a" stroke-width="4.0" stroke-linecap="round"><circle cx="382.0" cy="508" r="8.0"/><path d="M390.0,508 H410.0 M400.4,508 v8.0 M406.8,508 v6.0"/></g><text x="424" y="516.0" font-size="22" fill="#e8a83a">in charge</text><text x="368" y="562.0" font-size="22" fill="#aab0aa">moved by</text><text x="368" y="590.0" font-size="22" fill="#e2e6e2">your key, or</text><text x="368" y="617.5" font-size="22" fill="#e2e6e2">wallet code</text><path d="M388.4,633.9 A11,11 0 1,1 376.2,630.7" fill="none" stroke="#b491f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><text x="402" y="649.0" font-size="22" fill="#b491f0">new 7702 auth</text><rect x="900" y="330" width="270" height="340" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="918" y="376.0" font-size="28" fill="#33ff33" font-weight="700">CODE</text><text x="918" y="410.0" font-size="24" fill="#aab0aa">regular code</text><rect x="918" y="433.0" width="203.32" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="1019.66" y="459.9" font-size="22" fill="#33ff33" text-anchor="middle">real bytecode</text><g fill="none" stroke="#e8a83a" stroke-width="4.0" stroke-linecap="round"><circle cx="932.0" cy="508" r="8.0"/><path d="M940.0,508 H960.0 M950.4,508 v8.0 M956.8,508 v6.0"/></g><path d="M917.0,522.4 L963.0,493.6" stroke="#ff9a9f" stroke-width="4.0" stroke-linecap="round"/><text x="974" y="516.0" font-size="22" fill="#ff9a9f">off, or none</text><text x="918" y="562.0" font-size="22" fill="#aab0aa">moved by</text><text x="918" y="590.0" font-size="22" fill="#e2e6e2">its own code</text><path d="M938.4,633.9 A11,11 0 1,1 926.2,630.7" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><text x="952" y="649.0" font-size="22" fill="#33ff33">SETCODEFROM</text><path d="M894,500.0 L646,500.0" fill="none" stroke="#ff9a9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#ah4)"/><circle cx="770" cy="500.0" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M763.5,493.5 l13,13 M776.5,493.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><rect x="676.2" y="437.0" width="187.7" height="36" fill="#050805" opacity="0.92"/><text x="770" y="464.0" font-size="24" fill="#ff9a9f" text-anchor="middle" font-weight="700">no way back</text><path d="M200,330 C200,250 440,250 440,330" fill="none" stroke="#b491f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><rect x="189.0" y="195" width="262.1" height="62" fill="#050805" opacity="0.92"/><text x="320" y="222.0" font-size="24" fill="#b491f0" text-anchor="middle" font-weight="700">sign a 7702 auth</text><text x="320" y="250.0" font-size="22" fill="#aab0aa" text-anchor="middle">live since Pectra</text><path d="M560,670 C560,830 980,830 980,670" fill="none" stroke="#33ff33" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><rect x="549.7" y="819" width="440.6" height="62" fill="#050805" opacity="0.92"/><text x="770" y="846.0" font-size="24" fill="#33ff33" text-anchor="middle" font-weight="700">wallet code runs SETCODEFROM</text><text x="770" y="874.0" font-size="22" fill="#aab0aa" text-anchor="middle">8298 (draft)</text><path d="M420,670 C420,750 200,750 200,670" fill="none" stroke="#b491f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><rect x="103.9" y="759" width="392.3" height="62" fill="#050805" opacity="0.92"/><text x="300" y="786.0" font-size="24" fill="#b491f0" text-anchor="middle" font-weight="700">7702 auth to 0x0</text><text x="300" y="814.0" font-size="22" fill="#aab0aa" text-anchor="middle">not a pointer: code cleared</text><rect x="700" y="905" width="470" height="84" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2" stroke-dasharray="7 6"/><text x="720" y="940.0" font-size="24" fill="#e2e6e2">a fresh address, no key ever</text><text x="720" y="970.0" font-size="22" fill="#aab0aa">CREATE2 shell, then SETCODEFROM</text><path d="M1112,905 L1112,678" fill="none" stroke="#33ff33" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><rect x="30" y="905" width="640" height="160" rx="10" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="52" y="942.0" font-size="24" fill="#ff9a9f" font-weight="700">no way back to the left</text><text x="52" y="976.0" font-size="22" fill="#e2e6e2">7702: auths skipped once code is real</text><text x="52" y="1003.9" font-size="22" fill="#e2e6e2">8298: no empty or 0xEF source code</text><text x="52" y="1032.0" font-size="22" fill="#aab0aa">on purpose: a retired key stays retired</text><g fill="none" stroke="#e8a83a" stroke-width="3.4" stroke-linecap="round"><circle cx="40.2" cy="1114" r="6.8"/><path d="M47.0,1114 H64.0 M55.8,1114 v6.8 M61.3,1114 v5.1"/></g><text x="76" y="1121.0" font-size="22" fill="#aab0aa">the key</text><line x1="210" y1="1114" x2="250" y2="1114" stroke="#b491f0" stroke-width="4"/><text x="262" y="1121.0" font-size="22" fill="#aab0aa">7702 family</text><line x1="440" y1="1114" x2="480" y2="1114" stroke="#33ff33" stroke-width="4"/><text x="492" y="1121.0" font-size="22" fill="#aab0aa">SETCODEFROM</text><line x1="670" y1="1114" x2="710" y2="1114" stroke="#ff9a9f" stroke-width="3" stroke-dasharray="10 8"/><text x="722" y="1121.0" font-size="22" fill="#aab0aa">one way</text></svg>
