<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Retiring the ECDSA key with SETCODEFROM</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="880" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// want 3: retire the key</text><text x="30" y="104.0" font-size="22" fill="#aab0aa">one type 4 transaction</text><path d="M30,118 L30,128 L1170,128 L1170,118" fill="none" stroke="#aab0aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="146" width="360" height="130" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="52" y="188.0" font-size="24" fill="#e2e6e2" font-weight="700">1. delegate me</text><text x="52" y="222.0" font-size="22" fill="#aab0aa">to the migrator</text><rect x="420" y="146" width="360" height="130" rx="10" fill="#0a120a" stroke="#182818" stroke-width="2.5"/><text x="442" y="188.0" font-size="24" fill="#e2e6e2" font-weight="700">2. call myself</text><text x="442" y="222.0" font-size="22" fill="#aab0aa">SSTORE pq pubkey</text><text x="442" y="250.2" font-size="22" fill="#aab0aa">SSTORE recovery</text><rect x="810" y="146" width="360" height="130" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="832" y="188.0" font-size="24" fill="#33ff33" font-weight="700">3. SETCODEFROM</text><text x="832" y="222.0" font-size="22" fill="#aab0aa">(PQ wallet)</text><path d="M394,211 L414,211" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><path d="M784,211 L804,211" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><path d="M990,276 L990,318" fill="none" stroke="#ff9a9f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6" marker-end="url(#ah4)"/><rect x="810" y="322" width="360" height="128" rx="10" fill="#2a1214" stroke="#ff9a9f" stroke-width="2" stroke-dasharray="7 6"/><text x="830" y="356.0" font-size="22" fill="#ff9a9f" font-weight="700">returned 0 or reverted?</text><text x="830" y="386.0" font-size="22" fill="#e2e6e2">still delegated to the</text><text x="830" y="412.4" font-size="22" fill="#e2e6e2">migrator, key on. Sign</text><text x="830" y="438.8" font-size="22" fill="#e2e6e2">a new auth to leave.</text><text x="420" y="316.0" font-size="22" fill="#aab0aa">gate the migrator: only</text><text x="420" y="343.5" font-size="22" fill="#aab0aa">a call from yourself,</text><text x="420" y="371.0" font-size="22" fill="#aab0aa">or your own signature</text><rect x="30" y="520" width="250" height="170" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="52" y="566.0" font-size="26" fill="#e2e6e2" font-weight="700">DELEGATED</text><text x="52" y="600.0" font-size="22" fill="#e8a83a">key on</text><g fill="none" stroke="#e8a83a" stroke-width="5.0" stroke-linecap="round"><circle cx="67.0" cy="648" r="10.0"/><path d="M77.0,648 H102.0 M90.0,648 v10.0 M98.0,648 v7.5"/></g><path d="M292,605 L360,605" fill="none" stroke="#33ff33" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><rect x="372" y="520" width="250" height="170" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="394" y="566.0" font-size="26" fill="#33ff33" font-weight="700">CODE</text><text x="394" y="600.0" font-size="22" fill="#aab0aa">PQ wallet</text><g fill="none" stroke="#e8a83a" stroke-width="5.0" stroke-linecap="round"><circle cx="409.0" cy="648" r="10.0"/><path d="M419.0,648 H444.0 M432.0,648 v10.0 M440.0,648 v7.5"/></g><path d="M391.0,666.0 L447.0,630.0" stroke="#ff9a9f" stroke-width="5.0" stroke-linecap="round"/><circle cx="686" cy="552" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M679.5,545.5 l13,13 M692.5,545.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="716" y="560.0" font-size="22" fill="#e2e6e2">plain tx</text><text x="1170" y="560.0" font-size="22" fill="#ff9a9f" text-anchor="end">3607</text><circle cx="686" cy="606" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M679.5,599.5 l13,13 M692.5,599.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="716" y="614.0" font-size="22" fill="#e2e6e2">redelegate</text><text x="1170" y="614.0" font-size="22" fill="#ff9a9f" text-anchor="end">7702 auth check</text><circle cx="686" cy="660" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M679.5,653.5 l13,13 M692.5,653.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="716" y="668.0" font-size="22" fill="#e2e6e2">ecrecover permit</text><text x="1170" y="668.0" font-size="22" fill="#ff9a9f" text-anchor="end">8151 (draft)</text><text x="30" y="760.0" font-size="22" fill="#aab0aa">on this chain only: the key still signs on other chains,</text><text x="30" y="788.6" font-size="22" fill="#aab0aa">off chain, and in contracts that do ECDSA in their own code</text><text x="30" y="834.0" font-size="22" fill="#aab0aa">leaked key? the same move is a panic button, if your tx lands first</text></svg>
