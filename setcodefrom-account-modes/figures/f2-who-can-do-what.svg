0aa">8141 (draft)</text><text x="960" y="134.0" font-size="24" fill="#e2e6e2" font-weight="700">frame tx</text><rect x="20" y="168" width="1160" height="123" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><rect x="20" y="168" width="7" height="123" fill="#e8a83a"/><text x="44" y="220.0" font-size="28" fill="#e2e6e2" font-weight="700">EOA</text><text x="44" y="254.0" font-size="22" fill="#aab0aa">empty code</text><rect x="300" y="186.0" width="70.64" height="40" rx="20.0" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="335.32" y="214.6" font-size="24" fill="#e8a83a" text-anchor="middle">YES</text><text x="302" y="258.0" font-size="22" fill="#aab0aa">the classic</text><rect x="520" y="186.0" width="70.64" height="40" rx="20.0" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="555.32" y="214.6" font-size="24" fill="#e8a83a" text-anchor="middle">YES</text><text x="522" y="258.0" font-size="22" fill="#aab0aa">any time</text><rect x="740" y="186.0" width="70.64" height="40" rx="20.0" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="775.32" y="214.6" font-size="24" fill="#e8a83a" text-anchor="middle">YES</text><text x="742" y="258.0" font-size="22" fill="#aab0aa">empty code ok</text><rect x="960" y="186.0" width="70.64" height="40" rx="20.0" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="995.32" y="214.6" font-size="24" fill="#6fb2e8" text-anchor="middle">YES</text><text x="962" y="258.0" font-size="22" fill="#aab0aa">default code</text><rect x="20" y="303" width="1160" height="123" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><rect x="20" y="303" width="7" height="123" fill="#b491f0"/><text x="44" y="355.0" font-size="28" fill="#e2e6e2" font-weight="700">DELEGATED</text><text x="44" y="389.0" font-size="22" fill="#e8a83a">key on</text><rect x="300" y="321.0" width="70.64" height="40" rx="20.0" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="335.32" y="349.6" font-size="24" fill="#e8a83a" text-ancho