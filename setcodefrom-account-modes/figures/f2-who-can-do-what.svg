<text x="767.88" y="484.6" font-size="24" fill="#ff9a9f" text-anchor="middle">NO</text><text x="742" y="528.0" font-size="22" fill="#aab0aa">8151</text><rect x="960" y="456.0" width="100.4" height="40" rx="20.0" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2" stroke-dasharray="3 5"/><text x="1010.2" y="484.6" font-size="24" fill="#6fb2e8" text-anchor="middle">YES *</text><text x="962" y="528.0" font-size="22" fill="#aab0aa">your wallet</text><text x="962" y="554.4" font-size="22" fill="#aab0aa">decides</text><rect x="20" y="573" width="1160" height="123" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><rect x="20" y="573" width="7" height="123" fill="#33ff33"/><text x="44" y="625.0" font-size="28" fill="#33ff33" font-weight="700">CODE</text><text x="44" y="659.0" font-size="22" fill="#aab0aa">fresh or migrated</text><rect x="300" y="591.0" width="55.76" height="40" rx="20.0" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="327.88" y="619.6" font-size="24" fill="#ff9a9f" text-anchor="middle">NO</text><text x="302" y="663.0" font-size="22" fill="#aab0aa">3607</text><rect x="520" y="591.0" width="55.76" height="40" rx="20.0" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="547.88" y="619.6" font-size="24" fill="#ff9a9f" text-anchor="middle">NO</text><text x="522" y="663.0" font-size="22" fill="#aab0aa">7702 auth check</text><rect x="740" y="591.0" width="55.76" height="40" rx="20.0" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="767.88" y="619.6" font-size="24" fill="#ff9a9f" text-anchor="middle">NO</text><text x="742" y="663.0" font-size="22" fill="#aab0aa">8151</text><rect x="960" y="591.0" width="70.64" height="40" rx="20.0" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="995.32" y="619.6" font-size="24" fill="#6fb2e8" text-anchor="middle">YES</text><text x="962" y="663.0" font-size="22" fill="#aab0aa">your code</text><text x="962" y="689.4" font-size="22" fill="#aab0aa">decides</text><line x1="20" y1="432" x2="11