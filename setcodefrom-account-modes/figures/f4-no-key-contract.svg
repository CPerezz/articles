<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>A cheap copy of deployed code with SETCODEFROM, and no key</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="760" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// want 2: a cheap copy of deployed code</text><rect x="30" y="96" width="255" height="110" rx="10" fill="#0a120a" stroke="#182818" stroke-width="2.5"/><text x="157.5" y="142.0" font-size="24" fill="#e2e6e2" text-anchor="middle" font-weight="700">deploy</text><text x="157.5" y="176.0" font-size="22" fill="#aab0aa" text-anchor="middle">tx or CREATE2</text><rect x="325" y="96" width="255" height="110" rx="10" fill="#0a120a" stroke="#182818" stroke-width="2.5"/><text x="452.5" y="142.0" font-size="24" fill="#e2e6e2" text-anchor="middle" font-weight="700">initcode</text><text x="452.5" y="176.0" font-size="22" fill="#aab0aa" text-anchor="middle">SSTORE state</text><path d="M289,151 L319,151" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><rect x="620" y="96" width="255" height="110" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="747.5" y="142.0" font-size="24" fill="#33ff33" text-anchor="middle" font-weight="700">SETCODEFROM</text><text x="747.5" y="176.0" font-size="22" fill="#aab0aa" text-anchor="middle">(template)</text><path d="M584,151 L614,151" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><rect x="915" y="96" width="255" height="110" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="1042.5" y="142.0" font-size="24" fill="#33ff33" text-anchor="middle" font-weight="700">your clone</text><text x="1042.5" y="176.0" font-size="22" fill="#aab0aa" text-anchor="middle">template code</text><path d="M879,151 L909,151" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><rect x="620" y="290" width="550" height="100" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2" stroke-dasharray="7 6"/><text x="640" y="330.0" font-size="24" fill="#e2e6e2">template, deployed once</text><text x="640" y="362.0" font-size="22" fill="#aab0aa">every clone points here</text><path d="M1042.5,206 L1042.5,286" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6" marker-end="url(#ah0)"/><text x="1028.5" y="256.0" font-size="22" fill="#aab0aa" text-anchor="end">same codeHash</text><text x="30" y="318.0" font-size="22" fill="#e2e6e2">pinned: if the template changes or dies,</text><text x="30" y="346.0" font-size="22" fill="#e2e6e2">your clone keeps its code</text><text x="30" y="392.0" font-size="22" fill="#aab0aa">code cost, 32 KiB template (8037 prices)</text><text x="30" y="428.0" font-size="22" fill="#e2e6e2">via CREATE</text><rect x="250" y="412" width="310" height="20" rx="3" fill="#aab0aa"/><text x="572" y="428.0" font-size="22" fill="#e2e6e2" font-weight="700">50.1M gas</text><text x="30" y="462.0" font-size="22" fill="#33ff33">via SETCODEFROM</text><rect x="250" y="446" width="4" height="20" rx="1" fill="#33ff33"/><text x="264" y="462.0" font-size="22" fill="#33ff33" font-weight="700">9.3k gas, any size</text><rect x="30" y="500" width="555" height="230" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="54" y="544.0" font-size="24" fill="#b491f0" font-weight="700">a 7702 wallet</text><g fill="none" stroke="#e8a83a" stroke-width="6.4" stroke-linecap="round"><circle cx="73.2" cy="606" r="12.8"/><path d="M86.0,606 H118.0 M102.6,606 v12.8 M112.9,606 v9.6"/></g><text x="140" y="600.0" font-size="22" fill="#e2e6e2">a live key, by design</text><text x="140" y="628.0" font-size="22" fill="#aab0aa">it can always send a plain tx</text><text x="54" y="696.0" font-size="22" fill="#aab0aa">that's the point of 7702</text><rect x="615" y="500" width="555" height="230" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="639" y="544.0" font-size="24" fill="#33ff33" font-weight="700">this clone</text><g fill="none" stroke="#e8a83a" stroke-width="6.4" stroke-linecap="round"><circle cx="658.2" cy="606" r="12.8"/><path d="M671.0,606 H703.0 M687.6,606 v12.8 M697.9,606 v9.6"/></g><path d="M636.0,629.0 L706.0,583.0" stroke="#ff9a9f" stroke-width="6.4" stroke-linecap="round"/><text x="725" y="600.0" font-size="22" fill="#e2e6e2">no key exists</text><text x="725" y="628.0" font-size="22" fill="#aab0aa">nothing to switch off later</text><text x="639" y="680.0" font-size="21" fill="#aab0aa">even a 2^80 collision key gets nothing:</text><text x="639" y="707.3" font-size="21" fill="#aab0aa">3607, the 7702 auth check, 8151</text></svg>
