<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1144" viewBox="0 0 1200 1144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Cheat sheet: what you want, what to do, where you end up</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="1144" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// cheat sheet</text><text x="30" y="104.0" font-size="22" fill="#aab0aa">you want</text><text x="420" y="104.0" font-size="22" fill="#aab0aa">do this</text><text x="820" y="104.0" font-size="22" fill="#aab0aa">you end up</text><text x="1010" y="104.0" font-size="22" fill="#aab0aa">needs</text><rect x="20" y="130" width="1160" height="108" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="178.0" font-size="24" fill="#e2e6e2" font-weight="700">AA perks, zero setup</text><text x="420" y="178.0" font-size="22" fill="#e2e6e2">nothing: send 8141</text><text x="420" y="205.9" font-size="22" fill="#e2e6e2">frame txs</text><rect x="820" y="165.0" width="66.92" height="38" rx="19.0" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="853.46" y="191.9" font-size="22" fill="#e8a83a" text-anchor="middle">EOA</text><rect x="1010" y="170.0" width="73.12" height="28" rx="14.0" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="4 4"/><text x="1046.56" y="190.8" font-size="19" fill="#aab0aa" text-anchor="middle">8141</text><rect x="20" y="248" width="1160" height="108" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="296.0" font-size="24" fill="#e2e6e2" font-weight="700">smart wallet, the key</text><text x="40" y="324.1" font-size="24" fill="#e2e6e2" font-weight="700">stays the boss</text><text x="420" y="296.0" font-size="22" fill="#e2e6e2">sign a 7702 auth</text><rect x="820" y="283.0" width="107.84" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="873.92" y="309.9" font-size="22" fill="#b491f0" text-anchor="middle">key on</text><rect x="1010" y="288.0" width="73.12" height="28" rx="14.0" fill="#0a120a" stroke="#e2e6e2" stroke-width="2"/><text x="1046.56" y="308.8" font-size="19" fill="#e2e6e2" text-anchor="middle">7702</text><rect x="20" y="366" width="1160" height="108" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="414.0" font-size="24" fill="#e2e6e2" font-weight="700">code account, the key</text><text x="40" y="442.1" font-size="24" fill="#e2e6e2" font-weight="700">still signs</text><text x="420" y="414.0" font-size="22" fill="#e2e6e2">SETCODEFROM a wallet</text><text x="420" y="441.9" font-size="22" fill="#e2e6e2">that speaks 8141</text><rect x="820" y="401.0" width="80.56" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="860.28" y="427.9" font-size="22" fill="#33ff33" text-anchor="middle">CODE</text><rect x="1010" y="390.0" width="73.12" height="28" rx="14.0" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="4 4"/><text x="1046.56" y="410.8" font-size="19" fill="#aab0aa" text-anchor="middle">8298</text><rect x="1010" y="422.0" width="73.12" height="28" rx="14.0" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="4 4"/><text x="1046.56" y="442.8" font-size="19" fill="#aab0aa" text-anchor="middle">8141</text><rect x="20" y="484" width="1160" height="108" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="532.0" font-size="24" fill="#e2e6e2" font-weight="700">cheap copy of a</text><text x="40" y="560.1" font-size="24" fill="#e2e6e2" font-weight="700">deployed contract</text><text x="420" y="532.0" font-size="22" fill="#e2e6e2">deploy with initcode</text><text x="420" y="559.9" font-size="22" fill="#e2e6e2">that runs SETCODEFROM</text><rect x="820" y="519.0" width="80.56" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="860.28" y="545.9" font-size="22" fill="#33ff33" text-anchor="middle">CODE</text><rect x="1010" y="524.0" width="73.12" height="28" rx="14.0" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="4 4"/><text x="1046.56" y="544.8" font-size="19" fill="#aab0aa" text-anchor="middle">8298</text><rect x="20" y="602" width="1160" height="108" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="636.0" font-size="24" fill="#e2e6e2" font-weight="700">retire the key, go</text><text x="40" y="664.1" font-size="24" fill="#e2e6e2" font-weight="700">post quantum</text><text x="420" y="636.0" font-size="22" fill="#e2e6e2">store the PQ key, then</text><text x="420" y="663.9" font-size="22" fill="#e2e6e2">SETCODEFROM (or</text><text x="420" y="691.9" font-size="22" fill="#e2e6e2">SETSELFDELEGATE)</text><rect x="820" y="637.0" width="80.56" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="860.28" y="663.9" font-size="22" fill="#33ff33" text-anchor="middle">CODE</text><rect x="1010" y="610.0" width="73.12" height="28" rx="14.0" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="4 4"/><text x="1046.56" y="630.8" font-size="19" fill="#aab0aa" text-anchor="middle">8298</text><rect x="1010" y="642.0" width="73.12" height="28" rx="14.0" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="4 4"/><text x="1046.56" y="662.8" font-size="19" fill="#aab0aa" text-anchor="middle">8151</text><rect x="1010" y="674.0" width="73.12" height="28" rx="14.0" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="4 4"/><text x="1046.56" y="694.8" font-size="19" fill="#aab0aa" text-anchor="middle">7851</text><rect x="20" y="720" width="1160" height="108" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="754.0" font-size="24" fill="#e2e6e2" font-weight="700">switch wallets later</text><text x="420" y="754.0" font-size="22" fill="#e2e6e2">key on: new 7702 auth</text><text x="420" y="781.9" font-size="22" fill="#e2e6e2">key off: SETSELFDELEGATE</text><text x="420" y="809.9" font-size="22" fill="#e2e6e2">CODE: SETCODEFROM</text><rect x="820" y="755.0" width="80.56" height="38" rx="19.0" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="860.28" y="781.9" font-size="22" fill="#aab0aa" text-anchor="middle">same</text><rect x="1010" y="728.0" width="73.12" height="28" rx="14.0" fill="#0a120a" stroke="#e2e6e2" stroke-width="2"/><text x="1046.56" y="748.8" font-size="19" fill="#e2e6e2" text-anchor="middle">7702</text><rect x="1010" y="760.0" width="73.12" height="28" rx="14.0" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="4 4"/><text x="1046.56" y="780.8" font-size="19" fill="#aab0aa" text-anchor="middle">7851</text><rect x="1010" y="792.0" width="73.12" height="28" rx="14.0" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="4 4"/><text x="1046.56" y="812.8" font-size="19" fill="#aab0aa" text-anchor="middle">8298</text><rect x="20" y="838" width="1160" height="108" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="886.0" font-size="24" fill="#e2e6e2" font-weight="700">back to a plain EOA</text><text x="420" y="886.0" font-size="22" fill="#e2e6e2">7702 auth to 0x0</text><text x="420" y="913.9" font-size="22" fill="#e2e6e2">(only from key on)</text><rect x="820" y="873.0" width="66.92" height="38" rx="19.0" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="853.46" y="899.9" font-size="22" fill="#e8a83a" text-anchor="middle">EOA</text><rect x="1010" y="878.0" width="73.12" height="28" rx="14.0" fill="#0a120a" stroke="#e2e6e2" stroke-width="2"/><text x="1046.56" y="898.8" font-size="19" fill="#e2e6e2" text-anchor="middle">7702</text><rect x="20" y="956" width="1160" height="108" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="990.0" font-size="24" fill="#e2e6e2" font-weight="700">an ECDSA owner again</text><text x="40" y="1018.1" font-size="24" fill="#e2e6e2" font-weight="700">after going code</text><text x="420" y="990.0" font-size="22" fill="#e2e6e2">SETCODEFROM an ECDSA</text><text x="420" y="1017.9" font-size="22" fill="#e2e6e2">owner template, sign</text><text x="420" y="1045.9" font-size="22" fill="#e2e6e2">via 8141</text><rect x="820" y="991.0" width="80.56" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="860.28" y="1017.9" font-size="22" fill="#33ff33" text-anchor="middle">CODE</text><rect x="1010" y="980.0" width="73.12" height="28" rx="14.0" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="4 4"/><text x="1046.56" y="1000.8" font-size="19" fill="#aab0aa" text-anchor="middle">8298</text><rect x="1010" y="1012.0" width="73.12" height="28" rx="14.0" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="4 4"/><text x="1046.56" y="1032.8" font-size="19" fill="#aab0aa" text-anchor="middle">8141</text><text x="30" y="1118.0" font-size="22" fill="#aab0aa">dashed = draft, solid = live</text></svg>
