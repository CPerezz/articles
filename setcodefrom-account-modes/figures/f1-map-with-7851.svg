<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1183" viewBox="0 0 1200 1183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>The four account shapes, EIP-7851 included, and every move between them</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="1183" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// the map, with 7851</text><line x1="600" y1="110" x2="600" y2="890" stroke="#ff9a9f" stroke-width="2.5" stroke-dasharray="10 8"/><rect x="539.26" y="61.0" width="121.48" height="38" rx="19.0" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="600.0" y="87.9" font-size="22" fill="#ff9a9f" text-anchor="middle">one way</text><text x="30" y="150.0" font-size="24" fill="#e8a83a" font-weight="700" letter-spacing="2">KEY SIDE</text><text x="30" y="180.0" font-size="22" fill="#aab0aa">your key can always take the wheel back</text><text x="640" y="150.0" font-size="24" fill="#33ff33" font-weight="700" letter-spacing="2">CODE SIDE</text><text x="640" y="180.0" font-size="22" fill="#aab0aa">only code decides</text><rect x="30" y="330" width="245" height="340" rx="10" fill="#0a120a" stroke="#e8a83a" stroke-width="2.5"/><text x="48" y="376.0" font-size="28" fill="#e2e6e2" font-weight="700">EOA</text><text x="48" y="410.0" font-size="24" fill="#aab0aa">plain account</text><rect x="48" y="433.0" width="94.2" height="38" rx="19.0" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="95.1" y="459.9" font-size="22" fill="#aab0aa" text-anchor="middle">empty</text><g fill="none" stroke="#e8a83a" stroke-width="4.0" stroke-linecap="round"><circle cx="62.0" cy="508" r="8.0"/><path d="M70.0,508 H90.0 M80.4,508 v8.0 M86.8,508 v6.0"/></g><text x="104" y="516.0" font-size="22" fill="#e8a83a">in charge</text><text x="48" y="562.0" font-size="22" fill="#aab0aa">moved by</text><text x="48" y="590.0" font-size="22" fill="#e2e6e2">your key</text><rect x="315" y="330" width="245" height="340" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="333" y="376.0" font-size="28" fill="#e2e6e2" font-weight="700">DELEGATED</text><text x="333" y="410.0" font-size="24" fill="#e8a83a">key on</text><rect x="333" y="433.0" width="230.6" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="448.3" y="459.9" font-size="22" fill="#b491f0" text-anchor="middle">0xef0100+wallet</text><g fill="none" stroke="#e8a83a" stroke-width="4.0" stroke-linecap="round"><circle cx="347.0" cy="508" r="8.0"/><path d="M355.0,508 H375.0 M365.4,508 v8.0 M371.8,508 v6.0"/></g><text x="389" y="516.0" font-size="22" fill="#e8a83a">in charge</text><text x="333" y="562.0" font-size="22" fill="#aab0aa">moved by</text><text x="333" y="590.0" font-size="22" fill="#e2e6e2">your key, or</text><text x="333" y="617.5" font-size="22" fill="#e2e6e2">wallet code</text><path d="M353.4,633.9 A11,11 0 1,1 341.2,630.7" fill="none" stroke="#b491f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><text x="367" y="649.0" font-size="22" fill="#b491f0">new 7702 auth</text><rect x="640" y="330" width="245" height="340" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="658" y="376.0" font-size="28" fill="#e2e6e2" font-weight="700">DELEGATED</text><text x="658" y="410.0" font-size="24" fill="#ff9a9f">key off</text><rect x="658" y="433.0" width="230.6" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="773.3" y="459.9" font-size="22" fill="#b491f0" text-anchor="middle">0xef0101+wallet</text><g fill="none" stroke="#e8a83a" stroke-width="4.0" stroke-linecap="round"><circle cx="672.0" cy="508" r="8.0"/><path d="M680.0,508 H700.0 M690.4,508 v8.0 M696.8,508 v6.0"/></g><path d="M657.0,522.4 L703.0,493.6" stroke="#ff9a9f" stroke-width="4.0" stroke-linecap="round"/><text x="714" y="516.0" font-size="22" fill="#ff9a9f">switched off</text><text x="658" y="562.0" font-size="22" fill="#aab0aa">moved by</text><text x="658" y="590.0" font-size="22" fill="#e2e6e2">wallet code</text><path d="M678.4,633.9 A11,11 0 1,1 666.2,630.7" fill="none" stroke="#b491f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><text x="692" y="649.0" font-size="22" fill="#b491f0">new delegate</text><rect x="925" y="330" width="245" height="340" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="943" y="376.0" font-size="28" fill="#33ff33" font-weight="700">CODE</text><text x="943" y="410.0" font-size="24" fill="#aab0aa">regular code</text><rect x="943" y="433.0" width="203.32" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="1044.66" y="459.9" font-size="22" fill="#33ff33" text-anchor="middle">real bytecode</text><g fill="none" stroke="#e8a83a" stroke-width="4.0" stroke-linecap="round"><circle cx="957.0" cy="508" r="8.0"/><path d="M965.0,508 H985.0 M975.4,508 v8.0 M981.8,508 v6.0"/></g><path d="M942.0,522.4 L988.0,493.6" stroke="#ff9a9f" stroke-width="4.0" stroke-linecap="round"/><text x="999" y="516.0" font-size="22" fill="#ff9a9f">off, or none</text><text x="943" y="562.0" font-size="22" fill="#aab0aa">moved by</text><text x="943" y="590.0" font-size="22" fill="#e2e6e2">its own code</text><path d="M963.4,633.9 A11,11 0 1,1 951.2,630.7" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><text x="977" y="649.0" font-size="22" fill="#33ff33">SETCODEFROM</text><path d="M634,500.0 L566,500.0" fill="none" stroke="#ff9a9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#ah4)"/><circle cx="600" cy="500.0" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M593.5,493.5 l13,13 M606.5,493.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><path d="M200,330 C200,250 390,250 390,330" fill="none" stroke="#b491f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><rect x="164.0" y="195" width="262.1" height="62" fill="#050805" opacity="0.92"/><text x="295" y="222.0" font-size="24" fill="#b491f0" text-anchor="middle" font-weight="700">sign a 7702 auth</text><text x="295" y="250.0" font-size="22" fill="#aab0aa" text-anchor="middle">live since Pectra</text><path d="M500,330 C500,250 700,250 700,330" fill="none" stroke="#b491f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><rect x="476.4" y="195" width="247.2" height="62" fill="#050805" opacity="0.92"/><text x="600" y="222.0" font-size="24" fill="#b491f0" text-anchor="middle" font-weight="700">SETSELFDELEGATE</text><text x="600" y="250.0" font-size="22" fill="#aab0aa" text-anchor="middle">7851 (draft)</text><path d="M830,330 C830,250 985,250 985,330" fill="none" stroke="#33ff33" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9" marker-end="url(#ah0)"/><rect x="765.4" y="195" width="283.2" height="62" fill="#050805" opacity="0.92"/><text x="907" y="222.0" font-size="24" fill="#33ff33" text-anchor="middle" font-weight="700">SETCODEFROM too</text><text x="907" y="250.0" font-size="22" fill="#aab0aa" text-anchor="middle">not spelled out yet</text><path d="M480,670 C480,830 990,830 990,670" fill="none" stroke="#33ff33" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><rect x="514.7" y="819" width="440.6" height="62" fill="#050805" opacity="0.92"/><text x="735" y="846.0" font-size="24" fill="#33ff33" text-anchor="middle" font-weight="700">wallet code runs SETCODEFROM</text><text x="735" y="874.0" font-size="22" fill="#aab0aa" text-anchor="middle">8298 (draft)</text><path d="M360,670 C360,750 200,750 200,670" fill="none" stroke="#b491f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><rect x="83.9" y="759" width="392.3" height="62" fill="#050805" opacity="0.92"/><text x="280" y="786.0" font-size="24" fill="#b491f0" text-anchor="middle" font-weight="700">7702 auth to 0x0</text><text x="280" y="814.0" font-size="22" fill="#aab0aa" text-anchor="middle">not a pointer: code cleared</text><rect x="700" y="905" width="470" height="84" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2" stroke-dasharray="7 6"/><text x="720" y="940.0" font-size="24" fill="#e2e6e2">a fresh address, no key ever</text><text x="720" y="970.0" font-size="22" fill="#aab0aa">initcode runs SETCODEFROM</text><path d="M1112,905 L1112,678" fill="none" stroke="#33ff33" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><rect x="30" y="905" width="640" height="188" rx="10" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="52" y="942.0" font-size="24" fill="#ff9a9f" font-weight="700">no way back to the left</text><text x="52" y="976.0" font-size="22" fill="#e2e6e2">7702: auths skipped once code is real</text><text x="52" y="1003.9" font-size="22" fill="#e2e6e2">8298: no empty or 0xEF source code</text><text x="52" y="1031.9" font-size="22" fill="#e2e6e2">7851: key off never turns back on</text><text x="52" y="1060.0" font-size="22" fill="#aab0aa">on purpose: a retired key stays retired</text><g fill="none" stroke="#e8a83a" stroke-width="3.4" stroke-linecap="round"><circle cx="40.2" cy="1142" r="6.8"/><path d="M47.0,1142 H64.0 M55.8,1142 v6.8 M61.3,1142 v5.1"/></g><text x="76" y="1149.0" font-size="22" fill="#aab0aa">the key</text><line x1="210" y1="1142" x2="250" y2="1142" stroke="#b491f0" stroke-width="4"/><text x="262" y="1149.0" font-size="22" fill="#aab0aa">7702 family</text><line x1="440" y1="1142" x2="480" y2="1142" stroke="#33ff33" stroke-width="4"/><text x="492" y="1149.0" font-size="22" fill="#aab0aa">SETCODEFROM</text><line x1="670" y1="1142" x2="710" y2="1142" stroke="#33ff33" stroke-width="4" stroke-dasharray="2 9"/><text x="722" y="1149.0" font-size="22" fill="#aab0aa">not spelled out yet</text><line x1="1000" y1="1142" x2="1040" y2="1142" stroke="#ff9a9f" stroke-width="3" stroke-dasharray="10 8"/><text x="1052" y="1149.0" font-size="22" fill="#aab0aa">one way</text></svg>
