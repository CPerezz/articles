<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Keeping the ECDSA key: stay a delegate, or cross and keep it as a signer</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="1030" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// want 1: keep the key</text><text x="30" y="110.0" font-size="24" fill="#b491f0" font-weight="700">A. STAY A DELEGATE, KEY ON</text><text x="30" y="140.0" font-size="22" fill="#aab0aa">the cheap detour: you may not need to cross at all</text><g fill="none" stroke="#e8a83a" stroke-width="6.4" stroke-linecap="round"><circle cx="59.2" cy="298.0" r="12.8"/><path d="M72.0,298.0 H104.0 M88.6,298.0 v12.8 M98.9,298.0 v9.6"/></g><text x="40" y="354.0" font-size="22" fill="#e8a83a">your key</text><rect x="900" y="154" width="270" height="288" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="920" y="288.0" font-size="24" fill="#e2e6e2" font-weight="700">your account</text><rect x="920" y="307.0" width="230.6" height="38" rx="19.0" fill="#1f1530" stroke="#b491f0" stroke-width="2"/><text x="1035.3" y="333.9" font-size="22" fill="#b491f0" text-anchor="middle">0xef0100+wallet</text><path d="M110,298.0 C170,298.0 150,190 210,190" fill="none" stroke="#aab0aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="178.0" font-size="22" fill="#e2e6e2">plain tx</text><path d="M212,190 L894,190" fill="none" stroke="#e8a83a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah1)"/><text x="630" y="178.0" font-size="22" fill="#aab0aa">7702 lifts 3607</text><path d="M110,298.0 C170,298.0 150,262 210,262" fill="none" stroke="#aab0aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="250.0" font-size="22" fill="#e2e6e2">7702 auth</text><path d="M212,262 L894,262" fill="none" stroke="#e8a83a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah1)"/><text x="630" y="250.0" font-size="22" fill="#aab0aa">switch or clear</text><path d="M110,298.0 C170,298.0 150,334 210,334" fill="none" stroke="#aab0aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="322.0" font-size="22" fill="#e2e6e2">permit via ecrecover</text><path d="M212,334 L894,334" fill="none" stroke="#e8a83a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah1)"/><text x="630" y="322.0" font-size="22" fill="#aab0aa">8151 exempts it</text><path d="M110,298.0 C170,298.0 150,406 210,406" fill="none" stroke="#aab0aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="394.0" font-size="22" fill="#e2e6e2">frame tx (8141 draft)</text><line x1="212" y1="406" x2="560" y2="406" stroke="#6fb2e8" stroke-width="3"/><rect x="560" y="382" width="200" height="48" rx="8" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="660" y="414.0" font-size="22" fill="#6fb2e8" text-anchor="middle">your rules</text><path d="M760,406 L894,406" fill="none" stroke="#6fb2e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah3)"/><rect x="30" y="451.0" width="680.72" height="38" rx="19.0" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="370.36" y="477.9" font-size="22" fill="#e8a83a" text-anchor="middle">your rules are advice: the key walks around them</text><text x="30" y="514.0" font-size="22" fill="#aab0aa">and heads up: your wallet code can move you across the line too</text><line x1="20" y1="546" x2="1180" y2="546" stroke="#182818" stroke-width="2"/><text x="30" y="600.0" font-size="24" fill="#33ff33" font-weight="700">B. CROSS WITH SETCODEFROM, THE KEY STAYS A SIGNER</text><text x="30" y="630.0" font-size="22" fill="#aab0aa">the key still signs, the protocol checks it, your rules bind</text><g fill="none" stroke="#e8a83a" stroke-width="6.4" stroke-linecap="round"><circle cx="59.2" cy="788.0" r="12.8"/><path d="M72.0,788.0 H104.0 M88.6,788.0 v12.8 M98.9,788.0 v9.6"/></g><text x="40" y="844.0" font-size="22" fill="#e8a83a">your key</text><rect x="900" y="644" width="270" height="288" rx="10" fill="#0a120a" stroke="#33ff33" stroke-width="2.5"/><text x="920" y="778.0" font-size="24" fill="#e2e6e2" font-weight="700">your account</text><rect x="920" y="797.0" width="203.32" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="1021.66" y="823.9" font-size="22" fill="#33ff33" text-anchor="middle">real bytecode</text><path d="M110,788.0 C170,788.0 150,680 210,680" fill="none" stroke="#aab0aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="668.0" font-size="22" fill="#e2e6e2">plain tx</text><line x1="212" y1="680" x2="580" y2="680" stroke="#aab0aa" stroke-width="2.5"/><circle cx="600" cy="680" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M593.5,673.5 l13,13 M606.5,673.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="630" y="688.0" font-size="22" fill="#ff9a9f">3607</text><path d="M110,788.0 C170,788.0 150,752 210,752" fill="none" stroke="#aab0aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="740.0" font-size="22" fill="#e2e6e2">7702 auth</text><line x1="212" y1="752" x2="580" y2="752" stroke="#aab0aa" stroke-width="2.5"/><circle cx="600" cy="752" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M593.5,745.5 l13,13 M606.5,745.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="630" y="760.0" font-size="22" fill="#ff9a9f">7702 auth check</text><path d="M110,788.0 C170,788.0 150,824 210,824" fill="none" stroke="#aab0aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="812.0" font-size="22" fill="#e2e6e2">permit via ecrecover</text><line x1="212" y1="824" x2="580" y2="824" stroke="#aab0aa" stroke-width="2.5"/><circle cx="600" cy="824" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M593.5,817.5 l13,13 M606.5,817.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="630" y="832.0" font-size="22" fill="#ff9a9f">8151 (draft)</text><path d="M110,788.0 C170,788.0 150,896 210,896" fill="none" stroke="#aab0aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="884.0" font-size="22" fill="#e2e6e2">frame tx (8141 draft)</text><line x1="212" y1="896" x2="560" y2="896" stroke="#6fb2e8" stroke-width="3"/><rect x="560" y="872" width="200" height="48" rx="8" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="660" y="904.0" font-size="22" fill="#6fb2e8" text-anchor="middle">your rules</text><path d="M760,896 L894,896" fill="none" stroke="#6fb2e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah3)"/><text x="560" y="946.0" font-size="22" fill="#aab0aa">protocol checks the ECDSA, code reads SIGPARAM</text><rect x="30" y="967.0" width="1015.52" height="38" rx="19.0" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="537.76" y="993.6" font-size="21" fill="#aab0aa" text-anchor="middle">your own ERC 1271 check: the ecrecover as ECMUL trick, or a second owner key</text></svg>
