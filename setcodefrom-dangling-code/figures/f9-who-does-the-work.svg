<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Who does the work for each option, in Hegotá and at the PBT fork</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="900" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// who does the work, and when</text><text x="475" y="100.0" font-size="22" fill="#aab0aa" text-anchor="middle" font-weight="700" letter-spacing="2">IN HEGOTÁ</text><text x="945" y="100.0" font-size="22" fill="#aab0aa" text-anchor="middle" font-weight="700" letter-spacing="2">AT THE PBT FORK</text><line x1="705" y1="116" x2="705" y2="870" stroke="#aab0aa" stroke-width="2" stroke-dasharray="8 8"/><text x="30" y="166.0" font-size="40" fill="#33ff33" font-weight="700">A</text><text x="30" y="202.0" font-size="22" fill="#aab0aa">count now</text><rect x="270" y="130" width="420" height="36" rx="6" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="282" y="155.0" font-size="20" fill="#33ff33">8298: refcount rule + gas</text><rect x="270" y="174" width="420" height="36" rx="6" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="282" y="199.0" font-size="20" fill="#e2e6e2">clients build and keep a count</text><rect x="270" y="218" width="420" height="36" rx="6" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="282" y="243.0" font-size="20" fill="#e2e6e2">fix reorg and revert writes</text><rect x="270" y="262" width="420" height="36" rx="6" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="282" y="287.0" font-size="20" fill="#e2e6e2">clean up, archives keep history</text><rect x="730" y="130" width="440" height="36" rx="6" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="742" y="155.0" font-size="20" fill="#33ff33">count in the tree, or kept local</text><line x1="20" y1="326" x2="1180" y2="326" stroke="#182818" stroke-width="2"/><text x="30" y="382.0" font-size="40" fill="#e8a83a" font-weight="700">B</text><text x="30" y="418.0" font-size="22" fill="#aab0aa">ship as is</text><rect x="270" y="346" width="420" height="36" rx="6" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="6 6"/><text x="282" y="371.0" font-size="20" fill="#aab0aa">ship 8298 as is</text><rect x="730" y="346" width="440" height="36" rx="6" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="742" y="371.0" font-size="20" fill="#e8a83a">8297: never remove, or a count</text><text x="730" y="416.0" font-size="20" fill="#e8a83a" font-weight="700">if a count:</text><rect x="730" y="430" width="440" height="36" rx="6" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="742" y="455.0" font-size="20" fill="#e2e6e2">SETCODEFROM gas changes</text><rect x="730" y="474" width="440" height="36" rx="6" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="742" y="499.0" font-size="20" fill="#e2e6e2">count is consensus from day one</text><text x="730" y="542.0" font-size="20" fill="#e8a83a">every conversion path computes it</text><rect x="730" y="557.0" width="215.72" height="34" rx="17.0" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="837.86" y="580.5" font-size="18" fill="#e8a83a" text-anchor="middle">offline converter</text><rect x="956" y="557.0" width="193.4" height="34" rx="17.0" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="1052.7" y="580.5" font-size="18" fill="#e8a83a" text-anchor="middle">snapshot import</text><rect x="730" y="601.0" width="137.6" height="34" rx="17.0" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="798.8" y="624.5" font-size="18" fill="#e8a83a" text-anchor="middle">BAL replay</text><rect x="956" y="601.0" width="159.92" height="34" rx="17.0" fill="#2a1f08" stroke="#e8a83a" stroke-width="2"/><text x="1035.96" y="624.5" font-size="18" fill="#e8a83a" text-anchor="middle">self-convert</text><line x1="20" y1="656" x2="1180" y2="656" stroke="#182818" stroke-width="2"/><text x="30" y="712.0" font-size="40" fill="#6fb2e8" font-weight="700">C</text><text x="30" y="748.0" font-size="22" fill="#aab0aa">never remove</text><rect x="270" y="676" width="420" height="36" rx="6" fill="#141a14" stroke="#aab0aa" stroke-width="2" stroke-dasharray="6 6"/><text x="282" y="701.0" font-size="20" fill="#aab0aa">ship 8298 as is</text><rect x="730" y="676" width="440" height="36" rx="6" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="742" y="701.0" font-size="20" fill="#6fb2e8">one sentence: never removed</text><path d="M730,760 L1170,734 L1170,786 z" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="730" y="826.0" font-size="20" fill="#ff9a9f" font-weight="700">dead leaves pile up, forever</text></svg>
