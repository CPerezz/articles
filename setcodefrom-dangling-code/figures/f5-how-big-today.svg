<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>The leftover is tiny next to the state, and it already shaped two EIPs</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="820" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// how big is it today</text><text x="30" y="120.0" font-size="22" fill="#e2e6e2">state per full node</text><rect x="350" y="100" width="700.0" height="26" rx="2" fill="#0f2a12" stroke="#33ff33" stroke-width="1.5"/><text x="1064.0" y="120.0" font-size="22" fill="#33ff33" font-weight="700">≈ 280 GB</text><text x="30" y="180.0" font-size="22" fill="#e2e6e2">27,869 × 24 KiB</text><rect x="350" y="160" width="4" height="26" rx="2" fill="#ff9a9f" stroke="#ff9a9f" stroke-width="1.5"/><text x="368" y="180.0" font-size="22" fill="#ff9a9f" font-weight="700">0.68 GB · 0.24 %</text><text x="30" y="240.0" font-size="22" fill="#e2e6e2">27,869 × 64 KiB</text><rect x="350" y="220" width="4.565" height="26" rx="2" fill="#ff9a9f" stroke="#ff9a9f" stroke-width="1.5"/><text x="368.565" y="240.0" font-size="22" fill="#ff9a9f" font-weight="700">1.83 GB · 0.65 %</text><text x="30" y="300.0" font-size="22" fill="#e2e6e2">snap-synced node</text><text x="364.0" y="300.0" font-size="22" fill="#33ff33" font-weight="700">0, never fetched</text><text x="30" y="364.0" font-size="22" fill="#aab0aa">worst case: all 27,869 at the size limit (count: EIP-8058, as of Cancun)</text><line x1="20" y1="396" x2="1180" y2="396" stroke="#182818" stroke-width="2"/><text x="30" y="446.0" font-size="24" fill="#e2e6e2" font-weight="700">what it did cost: no one can ask a client for code by hash</text><rect x="443.78" y="481.0" width="312.44" height="38" rx="19.0" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="600.0" y="507.9" font-size="22" fill="#aab0aa" text-anchor="middle">"do you have code H?"</text><circle cx="820" cy="500" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M813.5,493.5 l13,13 M826.5,493.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="600" y="552.0" font-size="22" fill="#ff9a9f" text-anchor="middle">the answer depends on how the node synced</text><rect x="30" y="586" width="560" height="170" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="50" y="626.0" font-size="24" fill="#b491f0" font-weight="700">EIP-8058, dedup discount</text><text x="50" y="664.0" font-size="22" fill="#e2e6e2">skips the deposit for duplicate code</text><text x="50" y="692.6" font-size="22" fill="#e2e6e2">but asks the code hash of addresses</text><text x="50" y="721.2" font-size="22" fill="#e2e6e2">in the access list, not the code DB</text><rect x="610" y="586" width="560" height="170" rx="10" fill="#0a120a" stroke="#b491f0" stroke-width="2.5"/><text x="630" y="626.0" font-size="24" fill="#b491f0" font-weight="700">EIP-8298, SETCODEFROM</text><text x="630" y="664.0" font-size="22" fill="#e2e6e2">takes a source address and copies</text><text x="630" y="692.6" font-size="22" fill="#e2e6e2">its live code hash, never a raw</text><text x="630" y="721.2" font-size="22" fill="#e2e6e2">hash looked up in the code DB</text><text x="600" y="798.0" font-size="22" fill="#aab0aa" text-anchor="middle">both route around a table nobody agrees on</text></svg>
