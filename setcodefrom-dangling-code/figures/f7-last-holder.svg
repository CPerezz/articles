<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>SETCODEFROM lets the last holder of a code walk away from it</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="960" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// SETCODEFROM: the last holder walks away</text><text x="30" y="96.0" font-size="22" fill="#aab0aa" font-weight="700" letter-spacing="2">BEFORE</text><rect x="30" y="110" width="300" height="130" rx="10" fill="#0a120a" stroke="#e2e6e2" stroke-width="2"/><text x="50" y="150.0" font-size="26" fill="#e2e6e2" font-weight="700">A</text><text x="50" y="182.0" font-size="20" fill="#aab0aa">deployed by CREATE</text><rect x="50" y="197.0" width="107.84" height="34" rx="17.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="103.92" y="221.9" font-size="22" fill="#33ff33" text-anchor="middle">code Y</text><path d="M334,175 L414,175" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><rect x="420" y="145" width="60" height="60" rx="4" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="450.0" y="185.1" font-size="28" fill="#33ff33" text-anchor="middle" font-weight="700">Y</text><text x="450" y="232.0" font-size="20" fill="#33ff33" text-anchor="middle">1 holder</text><rect x="640" y="110" width="300" height="130" rx="10" fill="#0a120a" stroke="#e2e6e2" stroke-width="2"/><text x="660" y="150.0" font-size="26" fill="#e2e6e2" font-weight="700">S</text><text x="660" y="182.0" font-size="20" fill="#aab0aa">a template</text><rect x="660" y="197.0" width="107.84" height="34" rx="17.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="713.92" y="221.9" font-size="22" fill="#33ff33" text-anchor="middle">code X</text><path d="M944,175 L1024,175" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><rect x="1030" y="145" width="60" height="60" rx="4" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="1060.0" y="185.1" font-size="28" fill="#33ff33" text-anchor="middle" font-weight="700">X</text><text x="1060" y="232.0" font-size="20" fill="#33ff33" text-anchor="middle">n holders</text><path d="M180,250 L180,346" fill="none" stroke="#b491f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2)"/><text x="210" y="306.0" font-size="24" fill="#b491f0" font-weight="700">A runs SETCODEFROM(S)</text><text x="30" y="382.0" font-size="22" fill="#aab0aa" font-weight="700" letter-spacing="2">AFTER</text><rect x="30" y="396" width="300" height="130" rx="10" fill="#0a120a" stroke="#e2e6e2" stroke-width="2"/><text x="50" y="436.0" font-size="26" fill="#e2e6e2" font-weight="700">A</text><text x="50" y="468.0" font-size="20" fill="#aab0aa">adopted X</text><rect x="50" y="483.0" width="107.84" height="34" rx="17.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="103.92" y="507.9" font-size="22" fill="#33ff33" text-anchor="middle">code X</text><rect x="420" y="431" width="60" height="60" rx="4" fill="#2a1214" stroke="#ff9a9f" stroke-width="2"/><text x="450.0" y="471.1" font-size="28" fill="#ff9a9f" text-anchor="middle" font-weight="700">Y</text><text x="450" y="518.0" font-size="20" fill="#ff9a9f" text-anchor="middle" font-weight="700">0 holders</text><rect x="640" y="396" width="300" height="130" rx="10" fill="#0a120a" stroke="#e2e6e2" stroke-width="2"/><text x="660" y="436.0" font-size="26" fill="#e2e6e2" font-weight="700">S</text><text x="660" y="468.0" font-size="20" fill="#aab0aa">a template</text><rect x="660" y="483.0" width="107.84" height="34" rx="17.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="713.92" y="507.9" font-size="22" fill="#33ff33" text-anchor="middle">code X</text><path d="M944,461 L1024,461" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><path d="M300,396 C300,350 1060,350 1060,425" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah0)"/><rect x="1030" y="431" width="60" height="60" rx="4" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="1060.0" y="471.1" font-size="28" fill="#33ff33" text-anchor="middle" font-weight="700">X</text><text x="1060" y="518.0" font-size="20" fill="#33ff33" text-anchor="middle">n + 1 holders</text><rect x="30" y="570" width="560" height="280" rx="10" fill="#0a120a" stroke="#aab0aa" stroke-width="2"/><text x="50" y="610.0" font-size="24" fill="#e2e6e2" font-weight="700">UNDER THE MPT</text><text x="50" y="650.0" font-size="22" fill="#e2e6e2">Y stays in this node's code DB</text><text x="50" y="680.8" font-size="22" fill="#e2e6e2">snap sync never fetches it</text><circle cx="66" cy="730" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M58,731 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="738.0" font-size="22" fill="#33ff33" font-weight="700">local: sync sheds it</text><rect x="610" y="570" width="560" height="280" rx="10" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2.5"/><text x="630" y="610.0" font-size="24" fill="#6fb2e8" font-weight="700">UNDER PBT</text><text x="630" y="650.0" font-size="22" fill="#e2e6e2">Y's 2,115 leaves are in the root</text><circle cx="646" cy="706" r="17" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M639.5,699.5 l13,13 M652.5,699.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="676" y="714.0" font-size="22" fill="#ff9a9f">no count: every node stores,</text><text x="676" y="742.6" font-size="22" fill="#ff9a9f">syncs and serves them forever</text><circle cx="646" cy="794" r="17" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M638,795 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="676" y="802.0" font-size="22" fill="#33ff33">with a count: they go with</text><text x="676" y="830.6" font-size="22" fill="#33ff33">their last holder</text><text x="30" y="896.0" font-size="22" fill="#aab0aa">code adopted from a template never dangles: the template keeps it</text><text x="30" y="932.0" font-size="22" fill="#e8a83a">Y was paid at deploy: 100.3M state gas for 64 KiB. Orphaning it: 12,200 gas.</text></svg>
