 y="564.0" font-size="20" fill="#e2e6e2" text-anchor="middle">none</text><text x="927.0" y="564.0" font-size="20" fill="#e2e6e2" text-anchor="middle">none</text><text x="1089.0" y="551.0" font-size="20" fill="#e2e6e2" text-anchor="middle">history</text><text x="1089.0" y="577.0" font-size="20" fill="#e2e6e2" text-anchor="middle">pruning</text><text x="30" y="640.0" font-size="20" fill="#aab0aa">* Bonsai default. Databases from its older account-keyed mode drop code with the account</text><text x="30" y="668.0" font-size="20" fill="#aab0aa">¹ only blocks already on disk: blocks kept in memory never reach it</text><text x="30" y="696.0" font-size="20" fill="#aab0aa">² old bytes stay in history until pruned (forever on archive nodes)</text><text x="30" y="724.0" font-size="20" fill="#aab0aa">³ offline and hash scheme only: the default path scheme can't drop code</text><text x="30" y="752.0" font-size="20" fill="#aab0aa">never = never written · undone = rolled back · deleted = goes with the account</text></svg>
