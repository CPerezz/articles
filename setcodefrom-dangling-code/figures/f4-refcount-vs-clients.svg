x="942" y="373.0" font-size="20" fill="#e2e6e2">a copy per clone,</text><text x="942" y="399.0" font-size="20" fill="#e2e6e2">compressed ~4x</text><rect x="20" y="428" width="1160" height="110" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="464.0" font-size="22" fill="#e2e6e2" font-weight="700">deleting</text><text x="40" y="491.5" font-size="22" fill="#e2e6e2" font-weight="700">code</text><circle cx="324" cy="458" r="14" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M316,459 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="465.0" font-size="20" fill="#e2e6e2">when the count</text><text x="350" y="491.0" font-size="20" fill="#e2e6e2">drops to zero</text><circle cx="620" cy="458" r="14" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M613.5,451.5 l13,13 M626.5,451.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="646" y="465.0" font-size="20" fill="#e2e6e2">never: nobody</text><text x="646" y="491.0" font-size="20" fill="#e2e6e2">knows if it's</text><text x="646" y="517.0" font-size="20" fill="#e2e6e2">still used</text><circle cx="916" cy="458" r="14" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M908,459 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="942" y="465.0" font-size="20" fill="#e2e6e2">with its account</text><rect x="20" y="546" width="1160" height="84" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="582.0" font-size="22" fill="#e2e6e2" font-weight="700">inside a tree</text><text x="40" y="609.5" font-size="22" fill="#e2e6e2" font-weight="700">like PBT</text><circle cx="324" cy="576" r="14" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M316,577 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="583.0" font-size="20" fill="#e2e6e2">one copy, still</text><text x="350" y="609.0" font-size="20" fill="#e2e6e2">removable</text><circle cx="620" cy="576" r="14" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M613.5,569.5 l13,13 M626.5,569.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="646" y="583.0" font-size="20" fill="#e2e6e2">dead leaves stay</text><text x="646" y="609.0" font-size="20" fill="#e2e6e2">in the root</text><circle cx="916" cy="576" r="14" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M909.5,569.5 l13,13 M922.5,569.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="942" y="583.0" font-size="20" fill="#e2e6e2">every copy is its</text><text x="942" y="609.0" font-size="20" fill="#e2e6e2">own committed leaf</text><circle cx="42" cy="662" r="12" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M34,663 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="669.0" font-size="20" fill="#aab0aa">yes</text><circle cx="192" cy="662" r="12" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M185.5,655.5 l13,13 M198.5,655.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="214" y="669.0" font-size="20" fill="#aab0aa">no</text><circle cx="342" cy="662" r="12" fill="#141a14" stroke="#aab0aa" stroke-width="2.5"/><path d="M335,662 h14" stroke="#aab0aa" stroke-width="3.2" stroke-linecap="round"/><text x="364" y="669.0" font-size="20" fill="#aab0aa">partly</text></svg>
