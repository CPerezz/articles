ht="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="255.3" y="469.9" font-size="22" fill="#33ff33" text-anchor="middle">every full node</text><rect x="386.6" y="443.0" width="257.88" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="515.54" y="469.9" font-size="22" fill="#33ff33" text-anchor="middle">snap sync servers</text><rect x="660.48" y="443.0" width="353.36" height="38" rx="19.0" fill="#0f2a12" stroke="#33ff33" stroke-width="2"/><text x="837.1600000000001" y="469.9" font-size="22" fill="#33ff33" text-anchor="middle">AA-VOPS nodes (EIP-8369)</text><rect x="20" y="510" width="1160" height="190" rx="10" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2.5"/><text x="44" y="550.0" font-size="24" fill="#6fb2e8" font-weight="700">deleting shared code without a reference count</text><text x="44" y="592.0" font-size="22" fill="#e2e6e2">a shared code leaf exists while some account holds that code</text><text x="44" y="622.8" font-size="22" fill="#e2e6e2">since Cancun, an account with code dies only in the tx that created it</text><text x="44" y="674.0" font-size="22" fill="#6fb2e8" font-weight="700">→ a local check works, as long as no live account can replace its code</text></svg>
