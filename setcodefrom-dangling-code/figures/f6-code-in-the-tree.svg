<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Chunked code inside the state tree: the root commits to code bytes</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="730" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// code chunking puts code in the root</text><text x="30" y="82.0" font-size="22" fill="#aab0aa">PBT (EIP-8297), or any design that chunks code into the state</text><rect x="30" y="104" width="330" height="100" rx="10" fill="#0a120a" stroke="#6fb2e8" stroke-width="2.5"/><text x="44" y="144.0" font-size="22" fill="#e2e6e2" font-weight="700">one 64 KiB contract</text><text x="44" y="176.0" font-size="20" fill="#aab0aa">the EIP-7954 limit</text><rect x="435" y="104" width="330" height="100" rx="10" fill="#0a120a" stroke="#6fb2e8" stroke-width="2.5"/><text x="449" y="144.0" font-size="22" fill="#e2e6e2" font-weight="700">2,115 chunks</text><text x="449" y="176.0" font-size="20" fill="#aab0aa">31 code bytes each</text><rect x="840" y="104" width="330" height="100" rx="10" fill="#0a120a" stroke="#6fb2e8" stroke-width="2.5"/><text x="854" y="144.0" font-size="22" fill="#e2e6e2" font-weight="700">2,115 leaves</text><text x="854" y="176.0" font-size="20" fill="#aab0aa">+ ~2,115 branch nodes</text><path d="M364,154 L429,154" fill="none" stroke="#6fb2e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah3)"/><path d="M769,154 L834,154" fill="none" stroke="#6fb2e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah3)"/><circle cx="600" cy="256" r="18" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><text x="630" y="264.0" font-size="22" fill="#33ff33" font-weight="700">state root</text><line x1="600" y1="274" x2="380" y2="318" stroke="#aab0aa" stroke-width="1.5"/><rect x="312.44" y="319.0" width="135.12" height="38" rx="19.0" fill="#141a14" stroke="#aab0aa" stroke-width="2"/><text x="380.0" y="345.9" font-size="22" fill="#aab0aa" text-anchor="middle">accounts</text><line x1="600" y1="274" x2="820" y2="318" stroke="#6fb2e8" stroke-width="2.5"/><rect x="731.98" y="319.0" width="176.04" height="38" rx="19.0" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><text x="820.0" y="345.9" font-size="22" fill="#6fb2e8" text-anchor="middle">code chunks</text><line x1="820" y1="357" x2="655.0" y2="398" stroke="#6fb2e8" stroke-width="1.2"/><rect x="646.0" y="398" width="18" height="18" rx="4" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><line x1="820" y1="357" x2="685.0" y2="398" stroke="#6fb2e8" stroke-width="1.2"/><rect x="676.0" y="398" width="18" height="18" rx="4" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2"/><line x1="820" y1="357" x2="715.0" y2="398" stroke="#6fb2e8" stroke-width="1.2"/><rect x="706.0" y="398" width="18" height=