<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="818" viewBox="0 0 1200 818" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Three ways to ship SETCODEFROM, and what each one costs where</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33ff33"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a83a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b491f0"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb2e8"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a9f"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab0aa"/></marker></defs><rect width="1200" height="818" fill="#050805"/><text x="30" y="46.0" font-size="22" fill="#33ff33" font-weight="700" letter-spacing="2">// three ways to ship it</text><rect x="300" y="76" width="286" height="94" rx="10" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><text x="316" y="114.0" font-size="24" fill="#33ff33" font-weight="700">A · COUNT NOW</text><text x="316" y="146.0" font-size="20" fill="#aab0aa">refcount in Hegotá</text><rect x="596" y="76" width="286" height="94" rx="10" fill="#2a1f08" stroke="#e8a83a" stroke-width="2.5"/><text x="612" y="114.0" font-size="24" fill="#e8a83a" font-weight="700">B · SHIP AS IS</text><text x="612" y="146.0" font-size="20" fill="#aab0aa">PBT decides later</text><rect x="892" y="76" width="286" height="94" rx="10" fill="#0b1d2c" stroke="#6fb2e8" stroke-width="2.5"/><text x="908" y="114.0" font-size="24" fill="#6fb2e8" font-weight="700">C · NEVER REMOVE</text><text x="908" y="146.0" font-size="20" fill="#aab0aa">said in the spec</text><rect x="20" y="184" width="1160" height="84" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="220.0" font-size="22" fill="#e2e6e2" font-weight="700">spec work</text><text x="40" y="247.5" font-size="22" fill="#e2e6e2" font-weight="700">in Hegotá</text><circle cx="324" cy="214" r="14" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M317.5,207.5 l13,13 M330.5,207.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="350" y="221.0" font-size="20" fill="#e2e6e2">8298: refcount</text><text x="350" y="247.0" font-size="20" fill="#e2e6e2">rule and its gas</text><circle cx="620" cy="214" r="14" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M612,215 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="646" y="221.0" font-size="20" fill="#e2e6e2">none</text><circle cx="916" cy="214" r="14" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M908,215 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="942" y="221.0" font-size="20" fill="#e2e6e2">none</text><rect x="20" y="276" width="1160" height="110" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="312.0" font-size="22" fill="#e2e6e2" font-weight="700">client work</text><text x="40" y="339.5" font-size="22" fill="#e2e6e2" font-weight="700">in Hegotá</text><circle cx="324" cy="306" r="14" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M317.5,299.5 l13,13 M330.5,299.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="350" y="313.0" font-size="20" fill="#e2e6e2">build the count,</text><text x="350" y="339.0" font-size="20" fill="#e2e6e2">fix reorg + revert</text><text x="350" y="365.0" font-size="20" fill="#e2e6e2">writes, clean up</text><circle cx="620" cy="306" r="14" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M612,307 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="646" y="313.0" font-size="20" fill="#e2e6e2">none</text><circle cx="916" cy="306" r="14" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M908,307 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="942" y="313.0" font-size="20" fill="#e2e6e2">none</text><rect x="20" y="394" width="1160" height="136" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="430.0" font-size="22" fill="#e2e6e2" font-weight="700">work at the</text><text x="40" y="457.5" font-size="22" fill="#e2e6e2" font-weight="700">PBT fork</text><circle cx="324" cy="424" r="14" fill="#141a14" stroke="#aab0aa" stroke-width="2.5"/><path d="M317,424 h14" stroke="#aab0aa" stroke-width="3.2" stroke-linecap="round"/><text x="350" y="431.0" font-size="20" fill="#e2e6e2">count in the tree</text><text x="350" y="457.0" font-size="20" fill="#e2e6e2">or kept local</text><circle cx="620" cy="424" r="14" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M613.5,417.5 l13,13 M626.5,417.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="646" y="431.0" font-size="20" fill="#e2e6e2">never remove, or</text><text x="646" y="457.0" font-size="20" fill="#e2e6e2">a count + new gas,</text><text x="646" y="483.0" font-size="20" fill="#e2e6e2">rebuilt by every</text><text x="646" y="509.0" font-size="20" fill="#e2e6e2">conversion path</text><circle cx="916" cy="424" r="14" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M908,425 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="942" y="431.0" font-size="20" fill="#e2e6e2">one sentence:</text><text x="942" y="457.0" font-size="20" fill="#e2e6e2">replaced leaves</text><text x="942" y="483.0" font-size="20" fill="#e2e6e2">are never removed</text><rect x="20" y="538" width="1160" height="84" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="574.0" font-size="22" fill="#e2e6e2" font-weight="700">dead code in</text><text x="40" y="601.5" font-size="22" fill="#e2e6e2" font-weight="700">the code zone</text><circle cx="324" cy="568" r="14" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M316,569 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="575.0" font-size="20" fill="#e2e6e2">goes with its</text><text x="350" y="601.0" font-size="20" fill="#e2e6e2">last holder</text><circle cx="620" cy="568" r="14" fill="#141a14" stroke="#aab0aa" stroke-width="2.5"/><path d="M613,568 h14" stroke="#aab0aa" stroke-width="3.2" stroke-linecap="round"/><text x="646" y="575.0" font-size="20" fill="#e2e6e2">whatever PBT</text><text x="646" y="601.0" font-size="20" fill="#e2e6e2">ends up picking</text><circle cx="916" cy="568" r="14" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M909.5,561.5 l13,13 M922.5,561.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="942" y="575.0" font-size="20" fill="#e2e6e2">stays forever,</text><text x="942" y="601.0" font-size="20" fill="#e2e6e2">amount unknown</text><rect x="20" y="630" width="1160" height="110" rx="8" fill="#0a120a" stroke="#182818" stroke-width="2"/><text x="40" y="666.0" font-size="22" fill="#e2e6e2" font-weight="700">first refcount</text><text x="40" y="693.5" font-size="22" fill="#e2e6e2" font-weight="700">bug shows up as</text><circle cx="324" cy="660" r="14" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M316,661 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="667.0" font-size="20" fill="#e2e6e2">a leak or a stall,</text><text x="350" y="693.0" font-size="20" fill="#e2e6e2">under the MPT</text><circle cx="620" cy="660" r="14" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M613.5,653.5 l13,13 M626.5,653.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="646" y="667.0" font-size="20" fill="#e2e6e2">if PBT counts:</text><text x="646" y="693.0" font-size="20" fill="#e2e6e2">a different</text><text x="646" y="719.0" font-size="20" fill="#e2e6e2">state root</text><circle cx="916" cy="660" r="14" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M908,661 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="942" y="667.0" font-size="20" fill="#e2e6e2">no count, so</text><text x="942" y="693.0" font-size="20" fill="#e2e6e2">no count bug</text><circle cx="42" cy="778" r="12" fill="#0f2a12" stroke="#33ff33" stroke-width="2.5"/><path d="M34,779 l5,6 l11,-13" fill="none" stroke="#33ff33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="785.0" font-size="20" fill="#aab0aa">costs little here</text><circle cx="330" cy="778" r="12" fill="#2a1214" stroke="#ff9a9f" stroke-width="2.5"/><path d="M323.5,771.5 l13,13 M336.5,771.5 l-13,13" stroke="#ff9a9f" stroke-width="3.2" stroke-linecap="round"/><text x="352" y="785.0" font-size="20" fill="#aab0aa">costs something here</text><circle cx="660" cy="778" r="12" fill="#141a14" stroke="#aab0aa" stroke-width="2.5"/><path d="M653,778 h14" stroke="#aab0aa" stroke-width="3.2" stroke-linecap="round"/><text x="682" y="785.0" font-size="20" fill="#aab0aa">depends</text></svg>
