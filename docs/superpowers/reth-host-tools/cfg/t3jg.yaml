# reth state-DB study, run t3jg (jochemnet arm). Generated by mkcfg.py.
# scratch on md2 NVMe (measured reads), virgin on md3 HDD (restores); benchmarkoor default reth command.
global:
  log_level: info
runner:
  client_logs_to_stdout: true
  docker_network: benchmarkoor
  cleanup_on_start: true
  container_runtime: podman
  live_reporting:
    enabled: false
  benchmark:
    results_dir: /root/bench/reth/results/t3jg
    generate_results_index: true
    generate_suite_stats: true
    tests:
      metadata:
        labels:
          name: reth-t3jg-glamsterdam-stateful
          block: "24402727"
          test-type: stateful
          context: repricing
          fork: amsterdam
          data-disk-type: schelk
      filter: 'regex:(opcode_BALANCE-value_sent_0-account_mode_AccountMode\.(EXISTING_CONTRACT_MINIMAL|EXISTING_CONTRACT_SAME_MAX|EXISTING_EOA|EXISTING_CONTRACT_DIFF_MAX|EXISTING_CONTRACT_JUMPDEST)-overhead_baseline_False-cache_strategy_CacheStrategy\.NO_CACHE-benchmark-gas-value_160M|opcode_BALANCE-value_sent_0-account_mode_AccountMode\.EXISTING_CONTRACT_MINIMAL-overhead_baseline_True-cache_strategy_CacheStrategy\.NO_CACHE-benchmark-gas-value_160M|opcode_CALL-value_sent_0-account_mode_AccountMode\.(EXISTING_EOA|NON_EXISTING_ACCOUNT|EXISTING_CONTRACT_MINIMAL|EXISTING_CONTRACT_DIFF_MAX)-overhead_baseline_False-cache_strategy_CacheStrategy\.NO_CACHE-benchmark-gas-value_160M|opcode_CALL-value_sent_1-account_mode_AccountMode\.(EXISTING_EOA|EXISTING_CONTRACT_MINIMAL|EXISTING_CONTRACT_SAME_MAX)-overhead_baseline_False-cache_strategy_CacheStrategy\.NO_CACHE-benchmark-gas-value_160M|test_sload_bloated\[.*NO_CACHE-existing_slots_False-benchmark-gas-value_(160|240)M|test_sstore_bloated\[.*NO_CACHE-existing_slots_False-write_new_value_(True|False)-benchmark-gas-value_160M|transfer_amount_0-case_id_diff_to_(contract|existent|nonexistent|self)-benchmark-gas-value_160M)\]'
      source:
        eest_fixtures:
          fixtures_url: https://github.com/ethpandaops/benchmarkoor-tests/releases/download/eest-payloads-jochemnet-v1-amsterdam-stateful-d9ad55b3-20260807-000744/eest-payloads-jochemnet-v1-amsterdam-stateful-geth.tar.gz
          fixtures_subdir: benchmarkoor-build-artifacts/eest-payloads/geth/blockchain_tests_stateful_engine
  client:
    config:
      rollback_strategy: container-recreate
      drop_memory_caches: "steps"
    datadirs:
      reth:
        source_dir: /schelk-joc/reth
        method: schelk
  instances:
    - id: reth-t3jg
      client: reth
      image: docker.io/benchlocal/reth:devnet7-sigkill
      pull_policy: never
      genesis: /root/bench/besu-mainnet-genesis.json
      genesis_fork_override: { amsterdam: 1769856769 }
