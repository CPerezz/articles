# reth state-DB study, run s-smoke (state-actor arm). Generated by mkcfg.py.
# scratch on md2 NVMe (measured reads), virgin on md3 HDD (restores); benchmarkoor default reth command.
global:
  log_level: info
runner:
  client_logs_to_stdout: true
  docker_network: benchmarkoor
  cleanup_on_start: true
  container_runtime: podman
  live_reporting:
    enabled: false
  benchmark:
    results_dir: /root/bench/reth/results/s-heavy
    generate_results_index: true
    generate_suite_stats: true
    tests:
      metadata:
        labels:
          name: reth-s-smoke-glamsterdam-stateful
          block: "0"
          test-type: stateful
          context: repricing
          fork: amsterdam
          data-disk-type: schelk
      filter: 'regex:opcode_CALL-value_sent_1-account_mode_AccountMode\.EXISTING_CONTRACT_MINIMAL-overhead_baseline_False.*value_160M\]'
      source:
        eest_fixtures:
          local_fixtures_dir: /root/bench/reth/fixtures/sa-v2-full/nethermind
          fixtures_subdir: blockchain_tests_stateful_engine
  client:
    config:
      rollback_strategy: container-recreate
      drop_memory_caches: "steps"
    datadirs:
      reth:
        source_dir: /schelk-sa/reth
        method: schelk
  instances:
    - id: reth-s-smoke
      client: reth
      image: docker.io/benchlocal/reth:devnet7-sigkill
      pull_policy: never
      genesis: /schelk-sa/reth/chainspec.json
      genesis_fork_override: { amsterdam: 1 }
