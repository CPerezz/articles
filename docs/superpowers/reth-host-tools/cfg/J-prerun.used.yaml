# reth state-DB study, run j-prerun (jochemnet arm). Generated by mkcfg.py.
# scratch on md2 NVMe (measured reads), virgin on md3 HDD (restores); benchmarkoor default reth command.
global:
  log_level: info
runner:
  client_logs_to_stdout: true
  docker_network: benchmarkoor
  cleanup_on_start: true
  container_runtime: podman
  live_reporting:
    enabled: false
  benchmark:
    results_dir: /root/bench/reth/results/j-prerun
    generate_results_index: true
    generate_suite_stats: true
    tests:
      metadata:
        labels:
          name: reth-j-prerun-glamsterdam-stateful
          block: "24402727"
          test-type: stateful
          context: repricing
          fork: amsterdam
          data-disk-type: schelk
      filter: "regex:(BALANCE.*EXISTING_EOA.*overhead_baseline_False.*160M)"
      source:
        eest_fixtures:
          fixtures_url: https://github.com/ethpandaops/benchmarkoor-tests/releases/download/eest-payloads-jochemnet-v1-amsterdam-stateful-d9ad55b3-20260807-000744/eest-payloads-jochemnet-v1-amsterdam-stateful-geth.tar.gz
          fixtures_subdir: benchmarkoor-build-artifacts/eest-payloads/geth/blockchain_tests_stateful_engine
          pre_runs:
            fixtures_subdir: benchmarkoor-build-artifacts/pre-runs/geth/pre_run_bundle
  client:
    config:
      rollback_strategy: container-recreate
      drop_memory_caches: "steps"
    datadirs:
      reth:
        source_dir: /schelk-joc/reth
        method: schelk
        schelk_options:
          promote_post_pre_runs: true
  instances:
    - id: reth-j-prerun
      client: reth
      image: docker.io/ethpandaops/reth:glamsterdam-devnet-7@sha256:dc8936043e0c327aae5aa18adb804c48ca290700ed1ca40ba589783c4d042a48
      genesis: /root/bench/besu-mainnet-genesis.json
      genesis_fork_override: { amsterdam: 1769856769 }
      extra_args:
        - --engine.persistence-threshold=0
        - --engine.memory-block-buffer-target=0
