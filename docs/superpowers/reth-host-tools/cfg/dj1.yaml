# reth state-DB study, run dj1 (jochemnet arm). Generated by mkcfg.py.
# scratch on md2 NVMe (measured reads), virgin on md3 HDD (restores); benchmarkoor default reth command.
global:
  log_level: info
runner:
  client_logs_to_stdout: true
  docker_network: benchmarkoor
  cleanup_on_start: true
  container_runtime: podman
  live_reporting:
    enabled: false
  benchmark:
    results_dir: /root/bench/reth/results/dj1
    generate_results_index: true
    generate_suite_stats: true
    tests:
      metadata:
        labels:
          name: reth-dj1-glamsterdam-stateful
          block: "24402727"
          test-type: stateful
          context: repricing
          fork: amsterdam
          data-disk-type: schelk
      filter: 'regex:((test_account_access|test_ether_transfers_onchain_receivers|test_sstore_bloated|test_sload_same_key_benchmark|test_sload_bloated)\[|test_ext_account_query_warm\[fork_Amsterdam-blockchain_test_stateful_engine-(initial_storage_True-initial_balance_True-empty_code_True-opcode_BALANCE|initial_storage_True-initial_balance_True-empty_code_True-opcode_CALL|initial_storage_True-initial_balance_True-empty_code_True-opcode_CALLCODE|initial_storage_True-initial_balance_True-empty_code_True-opcode_DELEGATECALL|initial_storage_True-initial_balance_True-empty_code_True-opcode_EXTCODEHASH|initial_storage_True-initial_balance_True-empty_code_True-opcode_EXTCODESIZE|initial_storage_True-initial_balance_True-empty_code_True-opcode_STATICCALL)-benchmark).*value_(160|240)M\]'
      source:
        eest_fixtures:
          fixtures_url: https://github.com/ethpandaops/benchmarkoor-tests/releases/download/eest-payloads-jochemnet-v1-amsterdam-stateful-d9ad55b3-20260807-000744/eest-payloads-jochemnet-v1-amsterdam-stateful-geth.tar.gz
          fixtures_subdir: benchmarkoor-build-artifacts/eest-payloads/geth/blockchain_tests_stateful_engine
  client:
    config:
      rollback_strategy: container-recreate
      drop_memory_caches: "steps"
    datadirs:
      reth:
        source_dir: /schelk-joc/reth
        method: schelk
  instances:
    - id: reth-dj1
      client: reth
      image: docker.io/benchlocal/reth:devnet7-sigkill
      pull_policy: never
      genesis: /root/bench/besu-mainnet-genesis.json
      genesis_fork_override: { amsterdam: 1769856769 }
