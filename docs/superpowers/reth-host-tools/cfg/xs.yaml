# reth state-DB study, run xs (state-actor arm). Generated by mkcfg.py.
# scratch on md2 NVMe (measured reads), virgin on md3 HDD (restores); benchmarkoor default reth command.
global:
  log_level: info
runner:
  client_logs_to_stdout: true
  docker_network: benchmarkoor
  cleanup_on_start: true
  container_runtime: podman
  live_reporting:
    enabled: false
  benchmark:
    results_dir: /root/bench/reth/results/xs
    generate_results_index: true
    generate_suite_stats: true
    tests:
      metadata:
        labels:
          name: reth-xs-glamsterdam-stateful
          block: "0"
          test-type: stateful
          context: repricing
          fork: amsterdam
          data-disk-type: schelk
      filter: 'regex:(test_account_access\[.*overhead_baseline_False.*160M|test_sload_bloated\[.*160M|test_sstore_bloated\[.*160M)'
      source:
        eest_fixtures:
          local_fixtures_dir: /root/bench/reth/fixtures/sa-v2-full/nethermind
          fixtures_subdir: blockchain_tests_stateful_engine
  client:
    config:
      rollback_strategy: container-recreate
      drop_memory_caches: "steps"
    datadirs:
      reth:
        source_dir: /schelk-sa/reth
        method: schelk
  instances:
    - id: reth-xs
      client: reth
      image: docker.io/benchlocal/reth:devnet7-hashedreads
      pull_policy: never
      genesis: /schelk-sa/reth/chainspec.json
      genesis_fork_override: { amsterdam: 1 }
