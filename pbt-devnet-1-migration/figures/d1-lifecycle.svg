<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14"><defs><pattern id="hR" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#2a1214"/><rect width="2.5" height="5" fill="#ff9a9f"/></pattern><pattern id="hM" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#2a2210"/><rect width="2.5" height="5" fill="#e8a83a"/></pattern><pattern id="hG" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#0a120a"/><rect width="2.5" height="5" fill="#5c645c"/></pattern></defs><rect width="940" height="400" rx="12" fill="#000000"/><text x="24.0" y="38.0" font-size="18" fill="#e2e6e2" text-anchor="start" font-weight="600">The life of a migrating node</text><text x="24.0" y="60.0" font-size="12.5" fill="#aab0aa" text-anchor="start">what every geth, Nethermind and Besu node on the devnet went through, with the measured ranges on 16 GiB</text><rect x="24.00" y="104.00" width="214.00" height="78.00" rx="6" fill="#0a120a" stroke="#6fb2e8" stroke-width="1.2"></rect><text x="131.0" y="121.0" font-size="10.0" fill="#e2e6e2" text-anchor="middle" font-weight="600">1 · build the tree</text><text x="131.0" y="135.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">self-conversion 2h39m–4h57m</text><text x="131.0" y="148.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">import 2h11m–3h31m</text><text x="131.0" y="161.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">3.55 B leaves, validating meanwhile</text><rect x="248.00" y="104.00" width="214.00" height="78.00" rx="6" fill="#0a120a" stroke="#33ff33" stroke-width="1.2"></rect><text x="355.0" y="121.0" font-size="10.0" fill="#e2e6e2" text-anchor="middle" font-weight="600">2 · verify it</text><text x="355.0" y="135.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">check 1: tree root = header's</text><text x="355.0" y="148.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">check 2: MPT root re-derived, 40m–50m</text><text x="355.0" y="161.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">self on Nethermind/Besu: none yet</text><line x1="239.0" y1="143.0" x2="243.0" y2="143.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M242.0,139.5 L247.0,143.0 L242.0,146.5 Z" fill="#aab0aa"/><rect x="472.00" y="104.00" width="214.00" height="78.00" rx="6" fill="#0a120a" stroke="#8a948a" stroke-width="1.2"></rect><text x="579.0" y="121.0" font-size="10.0" fill="#e2e6e2" text-anchor="middle" font-weight="600">3 · replay the gap</text><text x="579.0" y="135.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">self: 1m45s–3m28s (0.9–1.5 k blocks)</text><text x="579.0" y="148.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">import: 1h48m–3h48m (52–58 k blocks)</text><text x="579.0" y="161.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">from the blocks' access lists</text><line x1="463.0" y1="143.0" x2="467.0" y2="143.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M466.0,139.5 L471.0,143.0 L466.0,146.5 Z" fill="#aab0aa"/><rect x="696.00" y="104.00" width="214.00" height="78.00" rx="6" fill="#0a120a" stroke="#b491f0" stroke-width="1.2"></rect><text x="803.0" y="121.0" font-size="10.0" fill="#e2e6e2" text-anchor="middle" font-weight="600">4 · two trees</text><text x="803.0" y="135.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">1–7 days at the head</text><text x="803.0" y="148.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">+ tens of ms per block</text><text x="803.0" y="161.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">+ 1–3 GiB of memory</text><line x1="687.0" y1="143.0" x2="691.0" y2="143.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M690.0,139.5 L695.0,143.0 L690.0,146.5 Z" fill="#aab0aa"/><rect x="136.00" y="222.00" width="214.00" height="78.00" rx="6" fill="#0a120a" stroke="#ff9a9f" stroke-width="1.2"></rect><text x="243.0" y="239.0" font-size="10.0" fill="#e2e6e2" text-anchor="middle" font-weight="600">5 · the fork</text><text x="243.0" y="253.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">10-29 09:00, block 24,551,102</text><text x="243.0" y="266.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">nine nodes on one root</text><text x="243.0" y="279.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">100 % participation, 0 missed slots</text><path d="M803.0,184.0 L803.0,196.0 L243.0,196.0 L243.0,217.0" fill="none" stroke="#aab0aa" stroke-width="1.2"/><path d="M239.5,216.0 L243.0,221.0 L246.5,216.0 Z" fill="#aab0aa"/><rect x="360.00" y="222.00" width="214.00" height="78.00" rx="6" fill="#0a120a" stroke="#e8a83a" stroke-width="1.2"></rect><text x="467.0" y="239.0" font-size="10.0" fill="#e2e6e2" text-anchor="middle" font-weight="600">6 · the window</text><text x="467.0" y="253.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">two trees until the fork finalizes:</text><text x="467.0" y="266.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">19 min on the devnet</text><text x="467.0" y="279.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">(a reorg across the fork still works)</text><line x1="351.0" y1="261.0" x2="355.0" y2="261.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M354.0,257.5 L359.0,261.0 L354.0,264.5 Z" fill="#aab0aa"/><rect x="584.00" y="222.00" width="214.00" height="78.00" rx="6" fill="#0a120a" stroke="#4a7a4a" stroke-width="1.2"></rect><text x="691.0" y="239.0" font-size="10.0" fill="#e2e6e2" text-anchor="middle" font-weight="600">7 · dispose the MPT</text><text x="691.0" y="253.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">−216 to −376 GiB freed (geth, Besu)</text><text x="691.0" y="266.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">one tree from here on</text><text x="691.0" y="279.0" font-size="9.0" fill="#aab0aa" text-anchor="middle">the migration is over</text><line x1="575.0" y1="261.0" x2="579.0" y2="261.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M578.0,257.5 L583.0,261.0 L578.0,264.5 Z" fill="#aab0aa"/><text x="24.0" y="322.0" font-size="9.5" fill="#e2e6e2" text-anchor="start">Steps 1–3 are the migration itself (the node keeps validating throughout); step 4 is the price of carrying two trees until the fork; steps 5–7 are the fork.</text><text x="24.0" y="335.0" font-size="9.5" fill="#e2e6e2" text-anchor="start">A snapshot import needs a producer, its 163 GB package, the anchor's finality and a week of replay; a self-conversion needs only the preimage file and the</text><text x="24.0" y="348.0" font-size="9.5" fill="#e2e6e2" text-anchor="start">node's own state.</text><text x="24.0" y="365.0" font-size="9.5" fill="#aab0aa" text-anchor="start">erigon's two nodes carry a binary commitment next to their hexary one by design and went through steps 4–7 only.</text></svg>