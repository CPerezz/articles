="#e2e6e2" text-anchor="start">1.35–1.71 TiB</text><text x="578.0" y="229.0" font-size="8.5" fill="#33ff33" text-anchor="start">self-conversion, peak datadir</text><rect x="748.00" y="199.00" width="168.00" height="34.00" rx="4" fill="#33ff33" opacity="0.14"></rect><text x="756.0" y="216.0" font-size="11" fill="#e2e6e2" text-anchor="start">1.52–1.95 TiB</text><text x="756.0" y="229.0" font-size="8.5" fill="#33ff33" text-anchor="start">import, incl. the 163 GB package</text><text x="24.0" y="256.0" font-size="11.5" fill="#e2e6e2" text-anchor="start" font-weight="600">CPU</text><text x="222.0" y="256.0" font-size="11" fill="#e2e6e2" text-anchor="start">4 c / 8 t</text><text x="400.0" y="256.0" font-size="11" fill="#e2e6e2" text-anchor="start">8 c / 16 t</text><rect x="570.00" y="239.00" width="168.00" height="34.00" rx="4" fill="#33ff33" opacity="0.14"></rect><text x="578.0" y="256.0" font-size="11" fill="#e2e6e2" text-anchor="start">16 vCPU</text><text x="578.0" y="269.0" font-size="8.5" fill="#33ff33" text-anchor="start">above both; 3–5 cores busy</text><rect x="748.00" y="239.00" width="168.00" height="34.00" rx="4" fill="#33ff33" opacity="0.14"></rect><text x="756.0" y="256.0" font-size="11" fill="#e2e6e2" text-anchor="start">16 vCPU</text><text x="756.0" y="269.0" font-size="8.5" fill="#33ff33" text-anchor="start">above both; 3–5 cores busy</text><text x="24.0" y="300.0" font-size="9.5" fill="#aab0aa" text-anchor="start">Memory and disk sat below the full-node line on every node. The migration's peak footprint, chain history included, stayed under 2 TiB on every</text><text x="24.0" y="313.0" font-size="9.5" fill="#aab0aa" text-anchor="start">self-conversion: half of EIP-7870's disk.</text></svg>