<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 416" width="940" height="416" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14"><defs><pattern id="hR" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#2a1214"/><rect width="2.5" height="5" fill="#ff9a9f"/></pattern><pattern id="hM" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#2a2210"/><rect width="2.5" height="5" fill="#e8a83a"/></pattern><pattern id="hG" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#0a120a"/><rect width="2.5" height="5" fill="#5c645c"/></pattern></defs><rect width="940" height="416" rx="12" fill="#000000"/><text x="24.0" y="38.0" font-size="18" fill="#e2e6e2" text-anchor="start" font-weight="600">Two ways to build the binary tree</text><text x="24.0" y="60.0" font-size="12.5" fill="#aab0aa" text-anchor="start">blue = construction · green = verification against a header · grey = inputs someone has to produce</text><text x="24.0" y="106.0" font-size="12.5" fill="#e2e6e2" text-anchor="start" font-weight="600">Snapshot import</text><text x="150.2" y="106.0" font-size="9.5" fill="#aab0aa" text-anchor="start">geth-1, geth-2, nethermind-1, nethermind-2, besu-1, besu-2</text><rect x="24.00" y="118.00" width="140.00" height="62.00" rx="6" fill="#101010" stroke="#8a948a" stroke-width="1.2"></rect><text x="94.0" y="135.0" font-size="10.5" fill="#e2e6e2" text-anchor="middle" font-weight="600">snapshot + preimages</text><text x="94.0" y="149.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">163 GB, produced and</text><text x="94.0" y="162.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">shipped by a third party</text><rect x="173.00" y="118.00" width="140.00" height="62.00" rx="6" fill="#0a120a" stroke="#33ff33" stroke-width="1.2"></rect><text x="243.0" y="135.0" font-size="10.5" fill="#e2e6e2" text-anchor="middle" font-weight="600">verify preimages</text><text x="243.0" y="149.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">every key hashes</text><text x="243.0" y="162.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">to its MPT path</text><line x1="165.0" y1="149.0" x2="168.0" y2="149.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M167.0,145.5 L172.0,149.0 L167.0,152.5 Z" fill="#aab0aa"/><rect x="322.00" y="118.00" width="140.00" height="62.00" rx="6" fill="#0a120a" stroke="#6fb2e8" stroke-width="1.2"></rect><text x="392.0" y="135.0" font-size="10.5" fill="#e2e6e2" text-anchor="middle" font-weight="600">stream leaves, build</text><text x="392.0" y="149.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">root = the snapshot's</text><text x="392.0" y="162.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">(check 1)</text><line x1="314.0" y1="149.0" x2="317.0" y2="149.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M316.0,145.5 L321.0,149.0 L316.0,152.5 Z" fill="#aab0aa"/><rect x="471.00" y="118.00" width="140.00" height="62.00" rx="6" fill="#0a120a" stroke="#6fb2e8" stroke-width="1.2"></rect><text x="541.0" y="135.0" font-size="10.5" fill="#e2e6e2" text-anchor="middle" font-weight="600">write nodes, code</text><text x="541.0" y="149.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">2.8 B nodes,</text><text x="541.0" y="162.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">2.5 M codes</text><line x1="463.0" y1="149.0" x2="466.0" y2="149.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M465.0,145.5 L470.0,149.0 L465.0,152.5 Z" fill="#aab0aa"/><rect x="620.00" y="118.00" width="140.00" height="62.00" rx="6" fill="#0a120a" stroke="#33ff33" stroke-width="1.2"></rect><text x="690.0" y="135.0" font-size="10.5" fill="#e2e6e2" text-anchor="middle" font-weight="600">check 2</text><text x="690.0" y="149.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">MPT root re-derived</text><text x="690.0" y="162.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">= header N</text><line x1="612.0" y1="149.0" x2="615.0" y2="149.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M614.0,145.5 L619.0,149.0 L614.0,152.5 Z" fill="#aab0aa"/><rect x="769.00" y="118.00" width="140.00" height="62.00" rx="6" fill="url(#hG)"></rect><text x="839.0" y="135.0" font-size="10" fill="#e2e6e2" text-anchor="middle" font-weight="600">replay N+1 → head</text><text x="839.0" y="149.0" font-size="9.5" fill="#e2e6e2" text-anchor="middle">52–58 k blocks</text><text x="839.0" y="162.0" font-size="9.5" fill="#e2e6e2" text-anchor="middle">of access lists</text><line x1="761.0" y1="149.0" x2="764.0" y2="149.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M763.0,145.5 L768.0,149.0 L763.0,152.5 Z" fill="#aab0aa"/><text x="24.0" y="236.0" font-size="12.5" fill="#e2e6e2" text-anchor="start" font-weight="600">Self-conversion</text><text x="150.2" y="236.0" font-size="9.5" fill="#aab0aa" text-anchor="start">geth-3, nethermind-1, besu-1</text><rect x="24.00" y="248.00" width="140.00" height="62.00" rx="6" fill="#101010" stroke="#8a948a" stroke-width="1.2"></rect><text x="94.0" y="265.0" font-size="10.5" fill="#e2e6e2" text-anchor="middle" font-weight="600">own flat state at P</text><text x="94.0" y="279.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">+ preimage file (62 GB)</text><text x="94.0" y="292.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">+ keys from BALs</text><rect x="173.00" y="248.00" width="140.00" height="62.00" rx="6" fill="#0a120a" stroke="#6fb2e8" stroke-width="1.2"></rect><text x="243.0" y="265.0" font-size="10.5" fill="#e2e6e2" text-anchor="middle" font-weight="600">scan own state</text><text x="243.0" y="279.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">accounts and slots,</text><text x="243.0" y="292.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">in key order</text><line x1="165.0" y1="279.0" x2="168.0" y2="279.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M167.0,275.5 L172.0,279.0 L167.0,282.5 Z" fill="#aab0aa"/><rect x="322.00" y="248.00" width="140.00" height="62.00" rx="6" fill="#0a120a" stroke="#6fb2e8" stroke-width="1.2"></rect><text x="392.0" y="265.0" font-size="10.5" fill="#e2e6e2" text-anchor="middle" font-weight="600">build + write</text><text x="392.0" y="279.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">3.6 B leaves</text><text x="392.0" y="292.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">→ 2.9 B nodes</text><line x1="314.0" y1="279.0" x2="317.0" y2="279.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M316.0,275.5 L321.0,279.0 L316.0,282.5 Z" fill="#aab0aa"/><rect x="471.00" y="248.00" width="140.00" height="62.00" rx="6" fill="#0a120a" stroke="#6fb2e8" stroke-width="1.2"></rect><text x="541.0" y="265.0" font-size="10.5" fill="#e2e6e2" text-anchor="middle" font-weight="600">code</text><text x="541.0" y="279.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">2.5 M codes</text><text x="541.0" y="292.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">re-assembled</text><line x1="463.0" y1="279.0" x2="466.0" y2="279.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M465.0,275.5 L470.0,279.0 L465.0,282.5 Z" fill="#aab0aa"/><rect x="620.00" y="248.00" width="140.00" height="62.00" rx="6" fill="#0a120a" stroke="#33ff33" stroke-width="1.2"></rect><text x="690.0" y="265.0" font-size="10.5" fill="#e2e6e2" text-anchor="middle" font-weight="600">check 2, geth only</text><text x="690.0" y="279.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">MPT root re-derived</text><text x="690.0" y="292.0" font-size="9.5" fill="#aab0aa" text-anchor="middle">= header P</text><line x1="612.0" y1="279.0" x2="615.0" y2="279.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M614.0,275.5 L619.0,279.0 L614.0,282.5 Z" fill="#aab0aa"/><rect x="769.00" y="248.00" width="140.00" height="62.00" rx="6" fill="url(#hG)"></rect><text x="839.0" y="265.0" font-size="10" fill="#e2e6e2" text-anchor="middle" font-weight="600">replay P+1 → head</text><text x="839.0" y="279.0" font-size="9.5" fill="#e2e6e2" text-anchor="middle">0.9–1.5 k blocks:</text><text x="839.0" y="292.0" font-size="9.5" fill="#e2e6e2" text-anchor="middle">a few minutes</text><line x1="761.0" y1="279.0" x2="764.0" y2="279.0" stroke="#aab0aa" stroke-width="1.2"/><path d="M763.0,275.5 L768.0,279.0 L763.0,282.5 Z" fill="#aab0aa"/><text x="24.0" y="350.0" font-size="10" fill="#e2e6e2" text-anchor="start">Moving pieces, import: a snapshot producer, its distribution, the preimage file, the anchor's finality, a week of blocks to replay.</text><text x="24.0" y="366.0" font-size="10" fill="#e2e6e2" text-anchor="start">Self-conversion: the preimage file and the node's own state; the replay is only the blocks produced while it converted.</text><text x="24.0" y="386.0" font-size="9.5" fill="#aab0aa" text-anchor="start">Nethermind's and Besu's self-conversions run no check 2: nothing verifies their tree until the fork's header carries the binary root. Our root sampling</text><text x="24.0" y="399.0" font-size="9.5" fill="#aab0aa" text-anchor="start">across nodes saw 0 divergences.</text></svg>