<svg class="chart" viewBox="0 0 760 296" role="img" preserveAspectRatio="xMinYMin meet" xmlns="http://www.w3.org/2000/svg"><style>svg{--bg:#000000;--fg:#e2e6e2;--muted:#aab0aa;--dim:#5c645c;--line:#182818;--panel:#0a120a;--accent:#33ff33;--green-dim:#28d128;--green-muted:#1a5a1a;--bad-bg:#2a1214;--bad-fg:#ff9a9f;--good-bg:#0f2a12;--good-fg:#7fd98f;--barbg:#182818;--chip:#0f1f0f;--db-c:#6fb2e8;--db-u:#e8a83a;--db-sa:#b491f0;font:11px 'IBM Plex Mono',ui-monospace,Menlo,monospace}text{fill:var(--fg)}text.tick,text.ax{fill:var(--muted)}text.big{font-size:12px;font-weight:600}</style><rect width="100%" height="100%" fill="var(--bg)"/><text x="0.0" y="14.0" text-anchor="start" class="big">six causes: where each sat, and what fixed it</text><text x="28.0" y="38.0" text-anchor="start" class="ax">where</text><text x="152.0" y="38.0" text-anchor="start" class="ax">cause</text><text x="524.0" y="38.0" text-anchor="start" class="ax">fix</text><line x1="0.0" y1="46.0" x2="760.0" y2="46.0" stroke="var(--line)" stroke-width="1"/><text x="10.0" y="69.0" text-anchor="middle" class="big">1</text><rect x="28.0" y="53.0" width="114.0" height="22.0" fill="var(--line)" fill-opacity="0.25" stroke="var(--green-muted)" stroke-width="1"/><text x="85.0" y="68.0" text-anchor="middle" class="tick">disk setup</text><text x="152.0" y="68.0" text-anchor="start">reads reach the disk one at a time</text><rect x="524.0" y="53.0" width="236.0" height="22.0" fill="var(--db-u)" fill-opacity="0.18" stroke="var(--db-u)" stroke-width="1"/><text x="532.0" y="68.0" text-anchor="start">direct I/O</text><line x1="0.0" y1="82.0" x2="760.0" y2="82.0" stroke="var(--line)" stroke-width="1"/><text x="10.0" y="105.0" text-anchor="middle" class="big">2</text><rect x="28.0" y="89.0" width="114.0" height="22.0" fill="var(--line)" fill-opacity="0.25" stroke="var(--green-muted)" stroke-width="1"/><text x="85.0" y="104.0" text-anchor="middle" class="tick">storage layout</text><text x="152.0" y="104.0" text-anchor="start">