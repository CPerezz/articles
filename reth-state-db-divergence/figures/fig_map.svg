ract holds a few hundred slots</text><rect x="524.0" y="197.0" width="236.0" height="22.0" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="1"/><text x="532.0" y="212.0" text-anchor="start">PR5: mainnet storage shape</text><line x1="0.0" y1="226.0" x2="760.0" y2="226.0" stroke="var(--line)" stroke-width="1"/><text x="10.0" y="249.0" text-anchor="middle" class="big">5</text><rect x="28.0" y="233.0" width="114.0" height="22.0" fill="var(--line)" fill-opacity="0.25" stroke="var(--green-muted)" stroke-width="1"/><text x="85.0" y="248.0" text-anchor="middle" class="tick">stored state</text><text x="152.0" y="248.0" text-anchor="start">21% more accounts than mainnet</text><rect x="524.0" y="233.0" width="236.0" height="22.0" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="1"/><text x="532.0" y="248.0" text-anchor="start">generate at mainnet&#x27;s count</text><line x1="0.0" y1="262.0" x2="760.0" y2="262.0" stroke="var(--line)" stroke-width="1"/><circle cx="4.0" cy="286.0" r="4" fill="var(--db-u)"></circle><text x="12.0" y="290.0" text-anchor="start" class="tick">fixed in the test setup</text><circle cx="177.8" cy="286.0" r="4" fill="var(--accent)"></circle><text x="185.8" y="290.0" text-anchor="start" class="tick">fixed in state-actor</text></svg>
